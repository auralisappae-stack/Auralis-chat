<!DOCTYPE html>
<html>
<head>
<title>Chat</title>

<style>
body {
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#1e1f22;
  color:white;
}

/* SIDEBAR */
#sidebar {
  width:200px;
  background:#2b2d31;
  padding:10px;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#messages {
  flex:1;
  padding:10px;
  overflow-y:auto;
}

.message {
  display:flex;
  margin-bottom:10px;
}

.avatar img {
  width:40px;
  height:40px;
  border-radius:50%;
  margin-right:10px;
}

.username {
  color:#5865f2;
  font-weight:bold;
}

/* INPUT */
#input-area {
  display:flex;
  padding:10px;
}

#input {
  flex:1;
  padding:10px;
}

button {
  margin-left:10px;
}
</style>
</head>

<body>

<div id="sidebar">
  <h3 id="userDisplay"></h3>
</div>

<div id="chat">

  <div id="messages"></div>

  <div id="input-area">
    <input id="input">
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
const username = localStorage.getItem("username");
const avatar = localStorage.getItem("avatar");

document.getElementById("userDisplay").innerText = username;

function send(){
  const msg = document.getElementById("input").value;

  const div = document.createElement("div");
  div.className = "message";

  div.innerHTML = `
    <div class="avatar">
      <img src="${avatar || 'https://via.placeholder.com/40'}">
    </div>
    <div>
      <div class="username">${username}</div>
      <div>${msg}</div>
    </div>
  `;

  document.getElementById("messages").appendChild(div);
  document.getElementById("input").value = "";
}
</script>

</body>
</html>
