<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auralis Final</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
  color:white;
  background:#020617;
}

/* APP */
#app{
  width:92%;
  height:90%;
  display:flex;
  border-radius:36px;
  background:rgba(10,15,30,0.6);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
}

/* RAIL */
#rail{
  width:85px;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 10px;
  gap:14px;
  background:rgba(5,10,20,0.7);
}
.server{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.05);
}
.server.active{
  background:linear-gradient(135deg,#5865f2,#9aa7ff);
  box-shadow:0 0 25px #5865f2;
}

/* SIDEBAR */
#sidebar{
  width:270px;
  padding:28px;
  background:rgba(15,23,42,0.55);
}

/* CHAT */
#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(rgba(2,6,23,0.7), rgba(2,6,23,0.9)),
    url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564");
  background-size:cover;
}

#chatHeader{
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  background:rgba(15,23,42,0.4);
}

/* MESSAGES */
#messages{flex:1;padding:30px;overflow-y:auto;}
.msg{display:flex;gap:12px;margin-bottom:22px;}
.avatar{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5865f2,#9aa7ff);
}
.bubble{
  padding:12px 16px;
  border-radius:18px;
  background:rgba(255,255,255,0.08);
}

/* INPUT BAR */
#inputBar{
  margin:20px;
  padding:12px;
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(15,23,42,0.55);
  position:relative;
}

.iconBtn{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0.8;
}
.iconBtn:hover{opacity:1;}

#msgInput{
  flex:1;
  background:none;
  border:none;
  color:white;
  outline:none;
}

#sendBtn{
  width:44px;height:44px;
  border-radius:50%;
  border:none;
  background:#5865f2;
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px rgba(88,101,242,0.8);
}

/* EMOJI PICKER */
#emojiPicker{
  position:absolute;
  bottom:80px;
  right:70px;
  background:#0f172a;
  padding:10px;
  border-radius:12px;
  display:none;
  max-width:260px;
  flex-wrap:wrap;
  gap:6px;
  z-index:9999;
}
#emojiPicker.active{
  display:flex;
}
#emojiPicker span{
  cursor:pointer;
  font-size:20px;
  padding:6px;
  border-radius:6px;
}
#emojiPicker span:hover{
  background:rgba(255,255,255,0.1);
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div id="app">

<div id="rail">
  <div class="server active">A</div>
</div>

<div id="sidebar">
  <div>Auralis Hub</div>
</div>

<div id="chat">

  <div id="chatHeader">
    <div># general</div>
  </div>

  <div id="messages"></div>

  <div id="inputBar">
    <div class="iconBtn">＋</div>
    <input id="msgInput" placeholder="Message #general">
    <div id="emojiBtn" class="iconBtn">😊</div>
    <button id="sendBtn">➤</button>
    <div id="emojiPicker"></div>
  </div>

</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAFZ0kdYk-HupIbGxTuY5EqE24xnwApEyc",
  authDomain: "auralis-web-app.firebaseapp.com",
  projectId: "auralis-web-app",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const username = localStorage.getItem("username") || "User";

/* SEND */
document.getElementById("sendBtn").onclick = () => {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;

  db.collection("messages").add({
    user: username,
    text: text,
    time: Date.now()
  });

  input.value = "";
};

/* ENTER KEY */
document.getElementById("msgInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") document.getElementById("sendBtn").click();
});

/* LIVE */
db.collection("messages").orderBy("time")
.onSnapshot(snapshot=>{
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";

  snapshot.forEach(doc=>{
    const msg = doc.data();

    const el = document.createElement("div");
    el.className = "msg";

    el.innerHTML = `
      <div class="avatar">${msg.user.charAt(0)}</div>
      <div>
        <div>${msg.user}</div>
        <div class="bubble">${msg.text}</div>
      </div>
    `;

    messagesDiv.appendChild(el);
  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
});

/* ================= EMOJI SYSTEM ================= */

const input = document.getElementById("msgInput");
const picker = document.getElementById("emojiPicker");
const emojiBtn = document.getElementById("emojiBtn");

/* TOGGLE */
emojiBtn.onclick = () => {
  picker.style.display = picker.style.display === "block" ? "none" : "flex";
};

/* EMOJIS */
const emojis = [
  "😀","😁","😂","🤣","😎","😍","🥶","🔥","💀","✨",
  "🚀","👍","❤️","👏","😈","😇","😜","🤖","👀","💎",
  "🎉","🥳","😡","😢","🤯","😴","🤩","😏","🙌","💯"
];

/* RENDER */
emojis.forEach(e=>{
  const span = document.createElement("span");
  span.textContent = e;

  span.onclick = ()=>{
    input.value += e;
    input.focus();
  };

  picker.appendChild(span);
});

/* CLOSE OUTSIDE */
document.addEventListener("click", (e)=>{
  if(!picker.contains(e.target) && e.target !== emojiBtn){
    picker.classList.remove("active");
  }
});
</script>

</body>
</html>
