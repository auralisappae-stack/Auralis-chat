/* ================= TYPING INDICATOR ================= */


.dots{
  display:flex;
  gap:4px;
  opacity:0;
}




.dots span{
  width:5px;
  height:5px;
  background:#94a3b8;
  border-radius:50%;




  animation: typingBounceFinal 1.2s infinite ease-in-out;
}




.dots span:nth-child(2){animation-delay:0.2s;}
.dots span:nth-child(3){animation-delay:0.4s;}




@keyframes typingBounceFinal {
  0%, 80%, 100% {
    transform: translateY(0);
    opacity: 0.3;
  }
  40% {
    transform: translateY(-6px);
    opacity: 1;
  }
}



/* ===== TYPING ANIMATION ===== */


.typingBox{
  padding:6px 25px;
  font-size:12px;
  color:#94a3b8;

  display:flex;
  align-items:center;
  gap:6px;


  min-height:20px; /* ✅ keeps space stable */
}



/* dots container */
.dots{
  display:flex;
  gap:4px;
  opacity:0; /* hidden by default */
}




/* each dot */
.dots span{
  width:5px;
  height:5px;
  background:#94a3b8;
  border-radius:50%;
  animation:bounce 1.2s infinite;
}


/* delays */
.dots span:nth-child(2){animation-delay:0.2s;}
.dots span:nth-child(3){animation-delay:0.4s;}




/* animation */
@keyframes bounce{
  0%,80%,100%{transform:scale(0.6);opacity:0.3;}
  40%{transform:scale(1);opacity:1;}
}



/* ===== FORCE TYPING ANIMATION (FINAL FIX) ===== */




@keyframes typingBounceFinal {
  0%, 80%, 100% {
    transform: translateY(0);
    opacity: 0.3;
  }
  40% {
    transform: translateY(-6px);
    opacity: 1;
  }
}




.dots span {
  animation-name: typingBounceFinal !important;
  animation-duration: 1.2s !important;
  animation-iteration-count: infinite !important;
  animation-timing-function: ease-in-out !important;




  display: inline-block !important;
}

.switch {

}


/* CIRCLE */
.slider::before {
  content: "";
  position: absolute;
  height: 20px;
  width: 20px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.3s;

}


/* ON STATE */

}

<script>


window.onload = () => {


  const firebaseConfig = {
  apiKey: "AIzaSyAFZ0kdYk-HupIbGxTuY5EqE24xnwApEyc",
  authDomain: "auralis-web-app.firebaseapp.com",
  projectId: "auralis-web-app",
};


firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let username = localStorage.getItem("username") || "Guest";






const slider = document.getElementById("colorSlider");
const colorHex = document.getElementById("colorHex");

if (slider && colorHex) {

  slider.addEventListener("input", () => {
    const hue = slider.value;
    const color = `hsl(${hue}, 80%, 60%)`;

    colorHex.value = color;

    db.collection("users")
      .doc(localStorage.getItem("username") || "Guest")
      .set({ bubbleColor: color });
  });

  colorHex.addEventListener("input", () => {
    let value = colorHex.value.trim();

    if (!value.startsWith("#")) value = "#" + value;

    if (/^#[0-9A-Fa-f]{6}$/.test(value)) {
      db.collection("users")
        .doc(localStorage.getItem("username") || "Guest")
        .set({ bubbleColor: value });
    }
  });

}


// 🎯 when user types or pastes HEX
colorHex.addEventListener("input", () => {
  let value = colorHex.value.trim();


  // make sure it starts with #
  if (!value.startsWith("#")) {
    value = "#" + value;
  }


  // check if valid HEX
  if (/^#[0-9A-Fa-f]{6}$/.test(value)) {


    // save to Firebase
    db.collection("users").doc(localStorage.getItem("username") || "Guest").set({
      bubbleColor: value
    });

const bubbleColor = msg.color || (isMe ? "#5865f2" : "rgba(255,255,255,0.08)");

   el.className = "msg " + (isMe ? "me" : "other") + (isGrouped ? " grouped" : "");

el.innerHTML = `

  <div class="bubbleWrap">

    <div class="bubble" style="background:${bubbleColor}">
      ${msg.text}
    </div>
  </div>
`;






    messagesDiv.appendChild(el);






    /* ✅ keep inside loop */
    lastUser = msg.user;
    lastTime = msg.time;
  });








  /* ✅ FORCE RENDER THEN SCROLL */
  requestAnimationFrame(() => {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

});

/* RENDER FUNCTION */
function loadCategory(cat){
  emojiList.innerHTML = "";








  emojiData[cat].forEach(e=>{
    const span = document.createElement("span");
    span.textContent = e;






    span.onclick = ()=>{
      input.value += e;
      input.focus();
    };








    emojiList.appendChild(span);
  });
}

setTimeout(() => {


  const typingDiv = document.getElementById("typingIndicator");
  const typingText = document.getElementById("typingText");




  // ✅ stop if not found (prevents crash)
  if (!typingDiv || !typingText) return;



  const dots = typingDiv.querySelector(".dots");
  if (!dots) return;


  db.collection("typing").onSnapshot(snapshot => {



    let typingUsers = [];








    snapshot.forEach(doc => {
      const data = doc.data();


      if (doc.id !== username && data.typing) {
        typingUsers.push(doc.id);
      }
    });


    if (typingUsers.length > 0) {

      typingText.textContent = typingUsers.join(", ") + " is typing";
      dots.style.opacity = "1";
      dots.style.display = "flex"; /* force visible */

    } else {


      typingText.textContent = "";
      dots.style.opacity = "0";
    }

  });


}, 0);
