<!DOCTYPE html>
<html>
<head>
  <title>Auralis Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #1e1f22;
      color: white;
      display: flex;
      height: 100vh;
    }

    /* LEFT SIDEBAR */
    #sidebar {
      width: 60px;
      background: #1a1b1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
    }

    .server {
      width: 40px;
      height: 40px;
      background: #5865f2;
      border-radius: 50%;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* CHANNELS */
    #channels {
      width: 200px;
      background: #2b2d31;
      padding: 10px;
    }

    .room {
      padding: 8px;
      cursor: pointer;
    }

    .room:hover {
      background: #404249;
    }

    /* CHAT AREA */
    #chatContainer {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: #2b2d31;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      background: #5865f2;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* USERS PANEL */
    #users {
      width: 200px;
      background: #2b2d31;
      padding: 10px;
    }

    .user {
      margin: 5px 0;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="server">A</div>
</div>

<!-- CHANNELS -->
<div id="channels">
  <h3>Rooms</h3>
  <div class="room" onclick="switchRoom('lobby')"># lobby</div>
  <div class="room" onclick="switchRoom('gaming')"># gaming</div>
</div>

<!-- CHAT -->
<div id="chatContainer">
  <div id="chat"></div>

  <div id="inputArea">
    <input id="message" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- USERS -->
<div id="users">
  <h3>Online</h3>
  <div id="userList"></div>
</div>

<script>
const ws = new WebSocket("ws://localhost:3000");

const username = localStorage.getItem("username");
let currentRoom = "lobby";

const chat = document.getElementById("chat");
const userList = document.getElementById("userList");

// CONNECT
ws.onopen = () => {
  ws.send(JSON.stringify({
    type: "join",
    user: username,
    room: currentRoom
  }));
};

// RECEIVE
ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);

  // MESSAGE
  if (msg.type === "message") {
    addMessage(`${msg.user.name}: ${msg.data}`);
  }

  // USER JOIN
  if (msg.type === "user-joined") {
    addMessage(`${msg.user.name} joined`, true);
  }

  // USER LEFT
  if (msg.type === "user-left") {
    addMessage(`${msg.user.name} left`, true);
  }

  // USER LIST
  if (msg.type === "user-list") {
    userList.innerHTML = "";
    msg.users.forEach(u => {
      const div = document.createElement("div");
      div.className = "user";
      div.textContent = u;
      userList.appendChild(div);
    });
  }
};

// SEND MESSAGE
function sendMessage() {
  const input = document.getElementById("message");

  ws.send(JSON.stringify({
    type: "message",
    data: input.value
  }));

  input.value = "";
}

// SWITCH ROOM
function switchRoom(room) {
  currentRoom = room;

  ws.send(JSON.stringify({
    type: "switch-room",
    room
  }));

  chat.innerHTML = "";
}

// ADD MESSAGE
function addMessage(text, system = false) {
  const div = document.createElement("div");
  div.textContent = text;

  if (system) {
    div.style.color = "#888";
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
