<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auralis Final</title>


<style>
*{box-sizing:border-box;}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
  color:white;
  background:#020617;
}


/* APP */
#app{
  width:92%;
  height:90%;
  display:flex;
  border-radius:36px;
  background:rgba(10,15,30,0.6);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
}


/* RAIL */
#rail{
  width:85px;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 10px;
  gap:14px;
  background:rgba(5,10,20,0.7);

  height:100%;
  position:relative; /* ✅ important */
}

.server{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.05);
}
.server.active{
  background:linear-gradient(135deg,#5865f2,#9aa7ff);
  box-shadow:0 0 25px #5865f2;
}


/* SIDEBAR */
#sidebar{
  width:270px;
  padding:28px;
  background:rgba(15,23,42,0.55);
  overflow: visible;
}


/* CHAT */
#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(rgba(2,6,23,0.7), rgba(2,6,23,0.9)),
    url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564");
  background-size:cover;
}


#chatHeader{
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  background:rgba(15,23,42,0.4);
}


/* MESSAGES */
#messages{flex:1;padding:30px;overflow-y:auto;}
.msg{display:flex;gap:12px;margin-bottom:22px;}
.avatar{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5865f2,#9aa7ff);
}


.bubble{
  width:100%;
  padding:12px 16px;
  border-radius:18px;
  line-height:1.4;

  word-break:break-word;
}

.bubbleWrap{
  display:flex;
  flex-direction:column;
  max-width:70%; /* 👈 controls bubble width */
}


.msg{
  display:flex;
  width:100%;
  margin-bottom:2px; /* 👈 very small base gap */
}

.msg.grouped{
  margin-bottom:0px; /* 👈 NO GAP */
}


.msg.grouped .bubble{
  border-radius:12px; /* smoother stacking */
}


/* LEFT (others) */
.bubble.other{
  background:rgba(255,255,255,0.08);
  margin-right:auto;
  border-bottom-left-radius:6px;
}

/* RIGHT (you) */
.bubble.me{
  background:#5865f2;
  margin-left:auto;
  border-bottom-right-radius:6px;
}

/* INPUT BAR */
#inputBar{
  margin:20px;
  padding:12px;
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(15,23,42,0.55);
  position:relative;
  
}




.iconBtn{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  opacity:0.8;
}
.iconBtn:hover{opacity:1;}


#msgInput{
  flex:1;
  background:none;
  border:none;
  color:white;
  outline:none;
}

#serversList{
  display:flex;
  flex-direction:column;
  gap:14px;
  flex:1;
  overflow-y:auto;          /* ✅ prevents pushing + out */
}

#addServer{
  position:absolute;   /* ✅ key fix */
  bottom:20px;         /* stick to bottom */
  left:50%;
  transform:translateX(-50%);
  
  width:52px;
  height:52px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  background:#1e293b;
  color:white;
  cursor:pointer;

  box-shadow:0 0 15px rgba(88,101,242,0.4);
}


#sendBtn{
  width:44px;height:44px;
  border-radius:50%;
  border:none;
  background:#5865f2;
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px rgba(88,101,242,0.8);
}


/* EMOJI PICKER */
#emojiPicker{
  position:absolute;
  bottom:80px;
  right:70px;
  background:#0f172a;
  padding:10px;
  border-radius:16px;
  display:none;
  width:260px;
  z-index:9999;
  flex-direction:column;
}


#emojiPicker.active{
  display:flex;
}


#emojiTabs{
  display:flex;
  justify-content:space-around;
  margin-bottom:8px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding-bottom:6px;
}


#emojiTabs span{
  cursor:pointer;
  font-size:18px;
  opacity:0.6;
}


#emojiTabs span:hover{
  opacity:1;
}


#emojiList{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  max-height:180px;
  overflow-y:auto;
}


#emojiList span{
  cursor:pointer;
  font-size:20px;
  padding:6px;
  border-radius:6px;
}


#emojiList span:hover{
  background:rgba(255,255,255,0.1);
}


/* 🔥 HIDE UGLY SCROLLBAR */
#messages::-webkit-scrollbar {
  width: 6px;
}

#messages::-webkit-scrollbar-track {
  background: transparent;
}

#messages::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
}

/* Hover effect */
#messages::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.3);
}

/* Firefox */
#messages {
  flex:1;
  padding:30px;
  overflow-y:auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
 

}

.msg{
  display:flex;
  width:100%;
  margin-bottom:6px; /* 👈 smaller gap */
}

/* LEFT (others) */
.msg.other {
  justify-content:flex-start;
}

/* RIGHT (you) */
.msg.me {
  justify-content:flex-end;

  animation: messageIn 0.2s ease;
}

/* flip layout for sender */
.msg.me .avatar {
  order:2;
}

.msg.me .bubbleWrap {
  order:1;
  align-items:flex-end;
}

/* bubble container */
.bubbleWrap {
  display:flex;
  flex-direction:column;
}

/* sender bubble */
.msg.me .bubble {
  background:linear-gradient(135deg,#5865f2,#9aa7ff);
  color:white;
}

/* receiver bubble */
.msg.other .bubble {
  background:rgba(255,255,255,0.08);
}





/* username */
.name {
  font-size:11px;
  color:#94a3b8;
  margin-bottom:4px;
}

.timeSeparator{
  text-align:center;
  font-size:12px;
  color:#94a3b8;
  margin:15px 0;
}






</style>


<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>


</head>


<body>


<div id="app">


<div id="rail">
  <div id="serversList">
    <div class="server active">A</div>
  </div>

  <div id="addServer">+</div> <!-- ✅ MUST EXIST -->
</div>


<div id="sidebar">
  <div>Auralis Hub</div>
</div>


<div id="chat">


  <div id="chatHeader">
    <div># general</div>
  </div>


  <div id="messages"></div>


  <div id="inputBar">
    <div class="iconBtn">＋</div>
    <input id="msgInput" placeholder="Message #general">
    <div id="emojiBtn" class="iconBtn">😊</div>
    <button id="sendBtn">➤</button>
    <div id="emojiPicker">

      <input type="color" id="colorPicker"
style="width:36px;height:36px;border:none;background:none;cursor:pointer;">


  <div id="emojiTabs">
    <span data-cat="faces">😀</span>
    <span data-cat="animals">🐱</span>
    <span data-cat="symbols">🔥</span>
    <span data-cat="flags">🏳️</span>


  </div>


  <div id="emojiList"></div>


</div>
  </div>


</div>
</div>


<!-- NOTE: This is where "is typing..." will appear -->
<div id="typingIndicator"
style="padding:10px 20px; font-size:13px; color:#94a3b8;"></div>

<!-- REMINDER:
Move this above input bar later for better UX
-->


<script>
const firebaseConfig = {
  apiKey: "AIzaSyAFZ0kdYk-HupIbGxTuY5EqE24xnwApEyc",
  authDomain: "auralis-web-app.firebaseapp.com",
  projectId: "auralis-web-app",
};


const colorPicker = document.getElementById("colorPicker");

colorPicker.addEventListener("input", (e)=>{
  const color = e.target.value;

  db.collection("users").doc(username).set({
    bubbleColor: color
  });
});


firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


const username = localStorage.getItem("username") || "User";


/* SEND */
document.getElementById("sendBtn").onclick = () => {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;


  db.collection("messages").add({
    user: username,
    text: text,
    time: Date.now()
  });


  input.value = "";
};


/* ENTER KEY */
document.getElementById("msgInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") document.getElementById("sendBtn").click();
});

db.collection("users").doc(username).set({
  bubbleColor: "#5865f2"
});

let userStyles = {};

db.collection("users").onSnapshot(snapshot=>{
  snapshot.forEach(doc=>{
    userStyles[doc.id] = doc.data();
  });
});

db.collection("messages").orderBy("time")
.onSnapshot(snapshot=>{
  const messagesDiv = document.getElementById("messages");

  /* ✅ clear safely */
  messagesDiv.innerHTML = "";

  let lastUser = null;
  let lastTime = null;


  

  snapshot.forEach(doc=>{
    const msg = doc.data();

    const timeDiff = lastTime ? (msg.time - lastTime) : 0;
    const isNewGroup = msg.user !== lastUser || timeDiff > 300000;
    const isGrouped = msg.user === lastUser && timeDiff < 300000;

    const isMe = msg.user === username;
    
    const userStyle = userStyles[msg.user];
const bubbleColor = userStyle?.bubbleColor || (isMe ? "#5865f2" : "rgba(255,255,255,0.08)");

    /* time separator */
    if (isNewGroup && lastTime) {
      const timeEl = document.createElement("div");
      timeEl.className = "timeSeparator";
      timeEl.textContent = new Date(msg.time).toLocaleTimeString();
      messagesDiv.appendChild(timeEl);
    }

    /* message wrapper */
    const el = document.createElement("div");
   el.className = "msg " + (isMe ? "me" : "other") + (isGrouped ? " grouped" : "");

    /* ✅ FIXED STRUCTURE (THIS WAS BREAKING UI) */
   el.innerHTML = `
  <div class="bubbleWrap">
    <div class="bubble" style="background:${bubbleColor}">
      ${msg.text}
    </div>
  </div>
`;

    messagesDiv.appendChild(el);

    /* ✅ keep inside loop */
    lastUser = msg.user;
    lastTime = msg.time;
  });

  /* ✅ FORCE RENDER THEN SCROLL */
  requestAnimationFrame(() => {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
});

/* ================= EMOJI SYSTEM ================= */
const input = document.getElementById("msgInput");
const picker = document.getElementById("emojiPicker");
const emojiBtn = document.getElementById("emojiBtn");
const emojiList = document.getElementById("emojiList");


/* TOGGLE */
emojiBtn.onclick = () => {
  picker.classList.toggle("active");
};


/* EMOJI CATEGORIES */
const emojiData = {
  faces: ["😀","😁","😂","🤣","😎","😍","😡","😢","😴","🤯","🥳"],
  animals: ["🐶","🐱","🦁","🐯","🐸","🐼","🐵","🦊","🐨"],
  symbols: ["🔥","✨","💀","💎","🚀","❤️","💯","⚡","⭐"],
  flags: ["🏳️","🏴","🇦🇪","🇺🇸","🇬🇧","🇯🇵","🇫🇷"]
};


/* RENDER FUNCTION */
function loadCategory(cat){
  emojiList.innerHTML = "";


  emojiData[cat].forEach(e=>{
    const span = document.createElement("span");
    span.textContent = e;


    span.onclick = ()=>{
      input.value += e;
      input.focus();
    };


    emojiList.appendChild(span);
  });
}


/* DEFAULT LOAD */
loadCategory("faces");


/* TAB SWITCH */
document.querySelectorAll("#emojiTabs span").forEach(tab=>{
  tab.onclick = ()=>{
    loadCategory(tab.dataset.cat);
  };
});


/* CLOSE OUTSIDE */
document.addEventListener("click", (e)=>{
  if(!picker.contains(e.target) && e.target !== emojiBtn){
    picker.classList.remove("active");
  }
});



const inputField = document.getElementById("msgInput");

let typingTimeout;

inputField.addEventListener("input", () => {

  // NOTE: tell Firebase "this user is typing"
  db.collection("typing").doc(username).set({
    typing: true
  });

  // NOTE: clear previous timeout so it resets while typing
  clearTimeout(typingTimeout);

  typingTimeout = setTimeout(() => {

    // NOTE: after 1.5s of no typing → set typing to false
    db.collection("typing").doc(username).set({
      typing: false
    });

  }, 1500);

  

});

/*
REMINDER (future improvements):
- Reduce Firebase writes (optimize with debounce)
- Delete typing status when user disconnects
*/

const typingDiv = document.getElementById("typingIndicator");

db.collection("typing").onSnapshot(snapshot => {

  let typingUsers = [];

  snapshot.forEach(doc => {
    const data = doc.data();

    // NOTE: ignore yourself, only show others
    if (doc.id !== username && data.typing) {
      typingUsers.push(doc.id);
    }
  });

  if (typingUsers.length > 0) {

    // NOTE: show names of users typing
    typingDiv.textContent = typingUsers.join(", ") + " is typing...";

  } else {

    // NOTE: clear when no one typing
    typingDiv.textContent = "";
  }

});

/*
REMINDER (future upgrades):
- Show "1 user typing" vs "2 users typing"
- Add avatars instead of names
- Add animated dots (...)
*/

</script>


</body>
</html>
