<!DOCTYPE html>
<html>
<head>
<title>Auralis Final</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
  color:white;
  background:#020617;
}

/* ================= APP FRAME ================= */
#app{
  width:92%;
  height:90%;
  display:flex;
  border-radius:36px;

  background:rgba(10,15,30,0.6);
  backdrop-filter:blur(30px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 0 100px rgba(88,101,242,0.2),
    inset 0 0 40px rgba(255,255,255,0.03);
}

/* ================= ICON RAIL ================= */
#rail{
  width:85px;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 10px;
  gap:14px;

  background:rgba(5,10,20,0.7);
  backdrop-filter:blur(20px);
}

.server{
  width:52px;
  height:52px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,0.05);
  cursor:pointer;
  transition:0.3s;
}

.server:hover{
  transform:translateY(-2px) scale(1.05);
  box-shadow:0 0 20px rgba(88,101,242,0.7);
}

.server.active{
  background:linear-gradient(135deg,#5865f2,#9aa7ff);
  box-shadow:0 0 25px #5865f2;
}

/* push + button down */
#serversList{
  display:flex;
  flex-direction:column;
  gap:14px;
  flex:1;
}

#addServer{
  margin-top:auto;
  background:#1e293b;
}

/* ================= SIDEBAR ================= */
#sidebar{
  width:270px;
  padding:28px;
  background:rgba(15,23,42,0.55);
  backdrop-filter:blur(25px);
}

.serverTitle{
  font-size:20px;
  font-weight:600;
}

.progress{
  margin-top:10px;
  height:6px;
  border-radius:10px;
  background:#0b0f1a;
  overflow:hidden;
}

.progress span{
  width:70%;
  height:100%;
  display:block;
  background:linear-gradient(90deg,#5865f2,#9aa7ff);
}

.section{
  margin-top:25px;
  font-size:11px;
  color:#7c8aa5;
}

.channel{
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  color:#aab4d4;
  cursor:pointer;
}

.channel.active{
  background:linear-gradient(90deg,rgba(88,101,242,0.3),transparent);
  color:white;
  box-shadow:inset 3px 0 #5865f2;
}

/* ================= CHAT ================= */
#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;

  /* 🔥 BACKGROUND INSIDE CHAT */
  background:
    linear-gradient(rgba(2,6,23,0.7), rgba(2,6,23,0.9)),
    radial-gradient(circle at 80% 50%, rgba(88,101,242,0.3), transparent 60%),
    url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564");

  background-size:cover;
  background-position:center;
}

/* HEADER */
#chatHeader{
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:rgba(15,23,42,0.4);
  backdrop-filter:blur(15px);
}

/* ================= MESSAGES ================= */
#messages{
  flex:1;
  padding:30px;
  overflow-y:auto;
}

.msg{
  display:flex;
  gap:12px;
  margin-bottom:22px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.avatar.blue{background:linear-gradient(135deg,#5865f2,#9aa7ff);}
.avatar.purple{background:linear-gradient(135deg,#a855f7,#6366f1);}
.avatar.pink{background:linear-gradient(135deg,#ec4899,#a855f7);}

.msgContent{
  display:flex;
  flex-direction:column;
}

.msgHeader{
  font-size:13px;
  margin-bottom:4px;
}

.username{
  font-weight:600;
  margin-right:8px;
}

.username.blue{color:#60a5fa;}
.username.purple{color:#c084fc;}
.username.pink{color:#f472b6;}

.time{
  color:#94a3b8;
  font-size:11px;
}

.bubble{
  padding:12px 16px;
  border-radius:18px;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.08);

  max-width:420px;
}

/* ================= INPUT ================= */
#inputBar{
  margin:20px;
  padding:12px;
  border-radius:999px;

  display:flex;
  align-items:center;
  gap:12px;

  background:rgba(15,23,42,0.55);
  backdrop-filter:blur(25px);

  box-shadow:0 0 30px rgba(88,101,242,0.25);
}

#inputBar input{
  flex:1;
  background:none;
  border:none;
  color:white;
  outline:none;
}

#sendBtn{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;

  background:linear-gradient(135deg,#5865f2,#9aa7ff);

  color:white;
  cursor:pointer;

  box-shadow:
    0 0 25px rgba(88,101,242,0.9),
    0 0 60px rgba(88,101,242,0.4);
}

</style>
</head>

<body>

<div id="app">

  <!-- SERVERS -->
  <div id="rail">
    <div id="serversList">
      <div class="server active">A</div>
      <div class="server">T</div>
    </div>
    <div id="addServer" class="server">+</div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="serverTitle">Auralis Hub</div>
    <div class="progress"><span></span></div>

    <div class="section">COMMUNITY</div>
    <div class="channel active"># general</div>
    <div class="channel"># random</div>
  </div>

  <!-- CHAT -->
  <div id="chat">

    <div id="chatHeader">
      <div># general</div>
      <div>🔍 📌 👥 ⋮</div>
    </div>

    <div id="messages">

      <div class="msg">
        <div class="avatar purple">AR</div>
        <div class="msgContent">
          <div class="msgHeader">
            <span class="username purple">Auralis Ranger</span>
            <span class="time">Today 10:24</span>
          </div>
          <div class="bubble">Welcome to Auralis ✨</div>
        </div>
      </div>

      <div class="msg">
        <div class="avatar blue">NX</div>
        <div class="msgContent">
          <div class="msgHeader">
            <span class="username blue">Nexus</span>
            <span class="time">10:25</span>
          </div>
          <div class="bubble">This is clean 🔥</div>
        </div>
      </div>

    </div>

    <div id="inputBar">
      <div>＋</div>
      <input placeholder="Message #general">
      <button id="sendBtn">➤</button>
    </div>

  </div>

</div>

</body>
</html>
