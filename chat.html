<!DOCTYPE html>
<html>
<head>
<title>Auralis Ultra</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: 'Inter', sans-serif;
  color:white;

  background:
    radial-gradient(circle at 75% 40%, rgba(88,101,242,0.25), transparent 60%),
    url("https://images.unsplash.com/photo-1446776811953-b23d57bd21aa");
  background-size:cover;
}

/* ================= MAIN FRAME ================= */
#app{
  width:92%;
  height:90%;
  display:flex;

  border-radius:36px;

  background: rgba(10,15,30,0.55);
  backdrop-filter: blur(30px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 0 80px rgba(88,101,242,0.2),
    inset 0 0 40px rgba(255,255,255,0.03);
}

/* ================= ICON RAIL ================= */
#rail{
  width:85px;
  padding:20px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;

  background: rgba(5,10,20,0.65);
  backdrop-filter: blur(25px);

  border-right:1px solid rgba(255,255,255,0.05);
}

.icon{
  width:52px;
  height:52px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background: rgba(255,255,255,0.05);

  transition:0.3s;
  cursor:pointer;
}

.icon:hover{
  transform:translateY(-2px) scale(1.05);
  box-shadow:0 0 18px rgba(88,101,242,0.6);
}

.icon.active{
  background:linear-gradient(135deg,#5865f2,#7c8cff);
  box-shadow:0 0 25px rgba(88,101,242,0.9);
}

/* ================= SIDEBAR ================= */
#sidebar{
  width:270px;
  padding:30px;

  background: rgba(15,23,42,0.55);
  backdrop-filter: blur(25px);

  border-right:1px solid rgba(255,255,255,0.05);
}

/* server card */
.serverCard{
  margin-bottom:30px;
}

.serverTitle{
  font-size:20px;
  font-weight:600;
}

.progress{
  margin-top:12px;
  height:6px;
  border-radius:10px;
  background:#0b0f1a;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  width:75%;
  background:linear-gradient(90deg,#5865f2,#9aa7ff);
  box-shadow:0 0 10px #5865f2;
}

/* channels */
.sectionTitle{
  font-size:11px;
  letter-spacing:1px;
  color:#7c8aa5;
  margin:20px 0 10px;
}

.channel{
  padding:10px;
  border-radius:10px;
  margin-bottom:6px;
  color:#aab4d4;
  cursor:pointer;
  transition:0.2s;
}

.channel:hover{
  background:rgba(255,255,255,0.05);
}

.channel.active{
  background:linear-gradient(90deg,rgba(88,101,242,0.3),transparent);
  color:white;
  box-shadow:inset 3px 0 0 #5865f2;
}

/* ================= CHAT ================= */
#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* background glow layer */
#chat::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at 80% 50%, rgba(88,101,242,0.25), transparent 60%),
    linear-gradient(rgba(2,6,23,0.4), rgba(2,6,23,0.9));

  z-index:0;
}

/* header */
#chatHeader{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;

  background: rgba(15,23,42,0.4);
  backdrop-filter: blur(15px);

  z-index:1;
}

/* messages */
#messages{
  flex:1;
  padding:30px;
  overflow-y:auto;
  z-index:1;
}

/* message */
.msg{
  display:flex;
  gap:12px;
  margin-bottom:22px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;

  background:linear-gradient(135deg,#5865f2,#9aa7ff);
}

/* bubble */
.bubble{
  padding:14px 18px;
  border-radius:18px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 0 10px rgba(0,0,0,0.2),
    inset 0 0 8px rgba(255,255,255,0.05);

  max-width:420px;
}

/* ================= INPUT ================= */
#inputBar{
  margin:18px;
  padding:12px;
  border-radius:999px;

  display:flex;
  align-items:center;
  gap:12px;

  background: rgba(15,23,42,0.55);
  backdrop-filter: blur(25px);

  box-shadow:
    0 0 25px rgba(88,101,242,0.25);

  z-index:1;
}

#inputBar input{
  flex:1;
  background:none;
  border:none;
  color:white;
  outline:none;
  font-size:14px;
}

/* send button */
#sendBtn{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;

  background:linear-gradient(135deg,#5865f2,#9aa7ff);

  color:white;
  font-size:18px;
  cursor:pointer;

  box-shadow:
    0 0 20px rgba(88,101,242,0.8),
    0 0 40px rgba(88,101,242,0.4);

  transition:0.2s;
}

#sendBtn:hover{
  transform:scale(1.1);
}

</style>
</head>

<body>

<div id="app">

  <!-- ICON RAIL -->
  <div id="rail">
    <div class="icon active">A</div>
    <div class="icon">🪐</div>
    <div class="icon">🌌</div>
    <div class="icon">✨</div>
    <div class="icon">+</div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="serverCard">
      <div class="serverTitle">Auralis Hub</div>
      <div class="progress"><span></span></div>
    </div>

    <div class="sectionTitle">COMMUNITY</div>
    <div class="channel active"># general</div>
    <div class="channel"># random</div>
  </div>

  <!-- CHAT -->
  <div id="chat">

    <div id="chatHeader">
      <div># general</div>
      <div>🔍 📌 👥 ⋮</div>
    </div>

    <div id="messages">
      <div class="msg">
        <div class="avatar">A</div>
        <div class="bubble">Welcome to Auralis 🚀</div>
      </div>

      <div class="msg">
        <div class="avatar">N</div>
        <div class="bubble">This design is starting to feel premium 👀</div>
      </div>
    </div>

    <div id="inputBar">
      <div>＋</div>
      <input placeholder="Message #general">
      <button id="sendBtn">➤</button>
    </div>

  </div>

</div>

</body>
</html>
