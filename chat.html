<!DOCTYPE html>
<html>
<head>
<title>Auralis Chat</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  font-family:Arial;
  color:white;
  background:#020617; /* dark base only */
}

/* ===== SERVERS ===== */
#servers {
  width:70px;
  background:#0b0f1a;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px;
}

#serverList {
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.server {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  cursor:pointer;
}

.server.active {
  border-radius:15px;
}

#addServer {
  margin-top:auto;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#1e293b;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:22px;
}

#addServer:hover {
  background:#5865f2;
  transform:scale(1.1);
}

/* ===== MAIN WRAPPER ===== */
#mainWrapper {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== GLASS BOX ===== */
#appBox {
  width:92%;
  height:92%;
  display:flex;
  border-radius:25px;
  backdrop-filter: blur(20px);
  background: rgba(20, 25, 40, 0.6);
  box-shadow: 0 0 40px rgba(88,101,242,0.2);
  overflow:hidden;
}

/* ===== SIDEBAR ===== */
#sidebar {
  width:240px;
  padding:20px;
  background: rgba(10,15,30,0.6);
}

.sectionTitle {
  font-size:12px;
  color:#888;
  margin-top:15px;
}

.channel {
  padding:8px;
  border-radius:8px;
  color:#aaa;
  cursor:pointer;
}

.channel.active {
  background:#5865f2;
  color:white;
}

/* ===== CHAT ===== */
#chatArea {
  flex:1;
  display:flex;
  flex-direction:column;

  background:
    linear-gradient(rgba(2,6,23,0.6), rgba(2,6,23,0.9)),
    url("https://images.unsplash.com/photo-1446776811953-b23d57bd21aa");

  background-size:cover;
  background-position:center;
}

#chatHeader {
  padding:15px;
  display:flex;
  justify-content:space-between;
  background: rgba(0,0,0,0.3);
}

#messages {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message {
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.avatar {
  width:40px;
  height:40px;
  border-radius:50%;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bubble {
  background: rgba(255,255,255,0.08);
  padding:12px;
  border-radius:15px;
  backdrop-filter: blur(10px);
}

/* INPUT */
#inputBar {
  display:flex;
  padding:15px;
  gap:10px;
}

#inputBar input {
  flex:1;
  padding:12px;
  border-radius:20px;
  border:none;
  background: rgba(255,255,255,0.08);
  color:white;
}

#inputBar button {
  width:45px;
  border:none;
  border-radius:50%;
  background:#5865f2;
  color:white;
}

/* ===== MEMBERS ===== */
#members {
  width:220px;
  background:#0f172a;
  padding:15px;
}

.member {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.memberAvatar {
  width:35px;
  height:35px;
  border-radius:50%;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
}

.online { color:#22c55e; }

</style>
</head>

<body>

<!-- SERVERS -->
<div id="servers">
  <div id="serverList"></div>
  <div id="addServer">+</div>
</div>

<!-- MAIN -->
<div id="mainWrapper">

  <div id="appBox">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sectionTitle">CHANNELS</div>
      <div class="channel active"># general</div>
      <div class="channel"># random</div>
    </div>

    <!-- CHAT -->
    <div id="chatArea">

      <div id="chatHeader">
        <span># general</span>
        <span>⚙ 👥</span>
      </div>

      <div id="messages"></div>

      <div id="inputBar">
        <input id="msgInput" placeholder="Message #general">
        <button onclick="sendMessage()">➤</button>
      </div>

    </div>

    <!-- MEMBERS -->
    <div id="members"></div>

  </div>

</div>

<script>

/* ===== USER ===== */
const username = localStorage.getItem("username") || "User";

/* ===== SERVERS ===== */
let servers = JSON.parse(localStorage.getItem("servers")) || [];

if (servers.length === 0) {
  servers.push({
    name: username + "'s server",
    icon: username.charAt(0).toUpperCase()
  });
}

const serverList = document.getElementById("serverList");

function renderServers() {
  serverList.innerHTML = "";

  servers.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "server";
    el.innerText = s.icon;

    if (i === 0) el.classList.add("active");

    el.onclick = () => {
      document.querySelectorAll(".server").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("chatHeader").innerText = "# " + s.name;
    };

    serverList.appendChild(el);
  });

  localStorage.setItem("servers", JSON.stringify(servers));
}

renderServers();

/* ADD SERVER */
document.getElementById("addServer").onclick = () => {
  const name = prompt("Server name:");
  if (!name) return;

  servers.push({
    name,
    icon: name.charAt(0).toUpperCase()
  });

  renderServers();
};

/* ===== MEMBERS ===== */
let members = JSON.parse(localStorage.getItem("members")) || [];

if (!members.find(m => m.name === username)) {
  members.push({ name: username, status: "online" });
}

const membersDiv = document.getElementById("members");

function renderMembers() {
  membersDiv.innerHTML = "<h4>Members</h4>";

  members.forEach(m => {
    const el = document.createElement("div");
    el.className = "member";

    el.innerHTML = `
      <div class="memberAvatar">${m.name.charAt(0)}</div>
      <div>
        <div>${m.name}</div>
        <div class="online">${m.status}</div>
      </div>
    `;

    membersDiv.appendChild(el);
  });

  localStorage.setItem("members", JSON.stringify(members));
}

renderMembers();

/* ===== CHAT ===== */
function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;

  const msg = document.createElement("div");
  msg.className = "message";

  msg.innerHTML = `
    <div class="avatar">${username.charAt(0)}</div>
    <div>
      <b>${username}</b>
      <div class="bubble">${text}</div>
    </div>
  `;

  document.getElementById("messages").appendChild(msg);
  input.value = "";
}

</script>

</body>
</html>
