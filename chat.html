<!DOCTYPE html>
<html>
<head>
  <title>Auralis Chat</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #313338;
      color: white;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    #sidebar {
      width: 70px;
      background: #1e1f22;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
    }

    .server {
      width: 50px;
      height: 50px;
      background: #5865f2;
      border-radius: 50%;
      margin: 10px 0;
    }

    /* Chat area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    #header {
      padding: 15px;
      background: #2b2d31;
      border-bottom: 1px solid #1e1f22;
    }

    /* Messages */
    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .msg {
      margin-bottom: 10px;
    }

    .username {
      font-weight: bold;
      color: #5865f2;
    }

    /* Input */
    #inputBox {
      display: flex;
      padding: 10px;
      background: #2b2d31;
    }

    #inputBox input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      outline: none;
    }

    #inputBox button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      background: #5865f2;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="server"></div>
  <div class="server"></div>
</div>

<!-- Main Chat -->
<div id="main">

  <div id="header">
    # general
  </div>

  <div id="messages"></div>

  <div id="inputBox">
    <input id="msgInput" placeholder="Message..." />
    <button onclick="sendMsg()">Send</button>
  </div>

</div>

<script>
const username = localStorage.getItem("username");
const ws = new WebSocket("wss://auralis-chat.onrender.com");

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);

  if (data.type === "message") {
    const messages = document.getElementById("messages");

    messages.innerHTML += `
      <div class="msg">
        <span class="username">${data.username}:</span>
        ${data.message}
      </div>
    `;

    messages.scrollTop = messages.scrollHeight;
  }
};

function sendMsg() {
  const input = document.getElementById("msgInput");

  ws.send(JSON.stringify({
    type: "message",
    username: username,
    message: input.value
  }));

  input.value = "";
}
</script>

</body>
</html>
