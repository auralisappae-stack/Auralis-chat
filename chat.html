<!DOCTYPE html>
<html>
<head>
<title>Auralis Final</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
  color:white;
  background:#020617;
}

/* ================= APP FRAME ================= */
#app{
  width:92%;
  height:90%;
  display:flex;
  border-radius:36px;
  background:rgba(10,15,30,0.6);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 0 100px rgba(88,101,242,0.2),
    inset 0 0 40px rgba(255,255,255,0.03);
}

/* ================= ICON RAIL ================= */
#rail{
  width:85px;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 10px;
  gap:14px;
  background:rgba(5,10,20,0.7);
}
.server{
  width:52px;
  height:52px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.05);
  cursor:pointer;
}
.server.active{
  background:linear-gradient(135deg,#5865f2,#9aa7ff);
  box-shadow:
    0 0 25px #5865f2,
    0 0 60px rgba(88,101,242,0.6);
}
#serversList{
  display:flex;
  flex-direction:column;
  gap:14px;
  flex:1;
}
#addServer{
  margin-top:auto;
  background:#1e293b;
}

/* ================= SIDEBAR ================= */
#sidebar{
  width:270px;
  padding:28px;
  background:rgba(15,23,42,0.55);
}
.serverTitle{font-size:20px;font-weight:600;}
.progress{margin-top:10px;height:6px;border-radius:10px;background:#0b0f1a;overflow:hidden;}
.progress span{width:70%;height:100%;display:block;background:linear-gradient(90deg,#5865f2,#9aa7ff);}
.section{margin-top:25px;font-size:11px;color:#7c8aa5;}
.channel{margin-top:8px;padding:10px;border-radius:10px;color:#aab4d4;}
.channel.active{
  background:linear-gradient(90deg,rgba(88,101,242,0.3),transparent);
  color:white;
}

/* ================= CHAT ================= */
#chat{
  flex:1;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(rgba(2,6,23,0.7), rgba(2,6,23,0.9)),
    url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564");
  background-size:cover;
}
#chatHeader{
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  background:rgba(15,23,42,0.4);
}

/* ================= MESSAGES ================= */
#messages{flex:1;padding:30px;overflow-y:auto;}
.msg{display:flex;gap:12px;margin-bottom:22px;}
.avatar{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5865f2,#9aa7ff);
}
.msgContent{display:flex;flex-direction:column;}
.msgHeader{font-size:13px;margin-bottom:4px;}
.username{font-weight:600;color:#60a5fa;}
.time{color:#94a3b8;font-size:11px;}
.bubble{
  padding:12px 16px;
  border-radius:18px;
  background:rgba(255,255,255,0.08);
}

/* INPUT */
#inputBar{
  margin:20px;
  padding:10px 14px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  background:rgba(15,23,42,0.55);
  backdrop-filter:blur(25px);

  box-shadow:
    0 0 30px rgba(88,101,242,0.25),
    inset 0 0 20px rgba(255,255,255,0.03);

  position:relative;
}

/* input */
#inputBar input{
  flex:1;
  background:none;
  border:none;
  color:white;
  outline:none;
  font-size:14px;
}

/* left + right containers */
.leftActions, .rightActions{
  display:flex;
  align-items:center;
  gap:10px;
}

/* icons */
.iconBtn{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  cursor:pointer;
  color:#94a3b8;
  transition:0.2s;
}

.iconBtn:hover{
  background:rgba(255,255,255,0.08);
  color:white;
}

/* send button (glow like your image) */
#sendBtn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#5865f2,#7c8cff);
  color:white;
  cursor:pointer;

  box-shadow:
    0 0 20px rgba(88,101,242,0.8),
    0 0 40px rgba(88,101,242,0.4);
}s
#inputBar input{
  flex:1;
  background:none;
  border:none;
  color:white;
  outline:none;
}
#sendBtn{
  width:48px;height:48px;border-radius:50%;
  border:none;
  background:#5865f2;
  color:white;
  cursor:pointer;
}
#emojiBtn{
  cursor:pointer;
}
#emojiPicker{
  position:absolute;
  bottom:60px;
  left:10px;
  background:#0f172a;
  padding:10px;
  border-radius:12px;
  display:none;
  gap:8px;
}
#emojiPicker span{
  cursor:pointer;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

</head>

<body>

<div id="app">

  <div id="rail">
    <div id="serversList">
      <div class="server active">A</div>
    </div>
    <div id="addServer" class="server">+</div>
  </div>

  <div id="sidebar">
    <div class="serverTitle">Auralis Hub</div>
    <div class="progress"><span></span></div>
    <div class="section">COMMUNITY</div>
    <div class="channel active"># general</div>
  </div>

  <div id="chat">

    <div id="chatHeader">
      <div># general</div>
      <div>🔍 📌 👥 ⋮</div>
    </div>

    <div id="messages"></div>

   <div id="inputBar">

  <div class="leftActions">
    <div class="iconBtn">＋</div>
  </div>

  <input id="msgInput" placeholder="Message #general">

  <div class="rightActions">
    <div id="emojiBtn" class="iconBtn">😊</div>
    <button id="sendBtn">➤</button>
  </div>

  <div id="emojiPicker"></div>

</div>

      <!-- emoji picker -->
      <div id="emojiPicker"></div>
    </div>

  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAFZ0kdYk-HupIbGxTuY5EqE24xnwApEyc",
  authDomain: "auralis-web-app.firebaseapp.com",
  projectId: "auralis-web-app",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const username = localStorage.getItem("username") || "User";

/* SEND */
document.getElementById("sendBtn").onclick = () => {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;

  db.collection("messages").add({
    user: username,
    text: text,
    time: Date.now()
  });

  input.value = "";
};

/* LIVE CHAT */
db.collection("messages")
.orderBy("time")
.onSnapshot(snapshot => {

  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";

  snapshot.docs.forEach(doc => {
    const msg = doc.data();

    const el = document.createElement("div");
    el.className = "msg";

    el.innerHTML = `
      <div class="avatar">${msg.user.charAt(0)}</div>
      <div class="msgContent">
        <div class="msgHeader">
          <span class="username">${msg.user}</span>
          <span class="time">${new Date(msg.time).toLocaleTimeString()}</span>
        </div>
        <div class="bubble">${msg.text}</div>
      </div>
    `;

    messagesDiv.appendChild(el);
  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
});

/* 😎 EMOJI SYSTEM */
const emojiBtn = document.getElementById("emojiBtn");
const picker = document.getElementById("emojiPicker");
const input = document.getElementById("msgInput");

const emojis = ["😀","😂","😍","🔥","✨","😎","😭","👍","💀","🚀"];

emojis.forEach(e => {
  const span = document.createElement("span");
  span.innerText = e;
  span.onclick = () => {
    input.value += e;
  };
  picker.appendChild(span);
});

emojiBtn.onclick = () => {
  picker.style.display = picker.style.display === "flex" ? "none" : "flex";
};
</script>

</body>
</html>
