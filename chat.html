<!DOCTYPE html>
<html>
<head>
<title>Auralis</title>

<style>

/* ================= GLOBAL ================= */
* {
  box-sizing: border-box;
}

body {
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: 'Segoe UI', sans-serif;
  color:white;

  background:
    radial-gradient(circle at 70% 40%, rgba(88,101,242,0.15), transparent 60%),
    url("https://images.unsplash.com/photo-1446776811953-b23d57bd21aa");

  background-size:cover;
  background-position:center;
}

/* ================= MAIN CONTAINER ================= */
#app {
  width:90%;
  height:90%;

  display:flex;

  border-radius:35px;

  background: rgba(10,15,30,0.55);
  backdrop-filter: blur(25px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 0 60px rgba(88,101,242,0.15),
    inset 0 0 30px rgba(255,255,255,0.03);
}

/* ================= ICON RAIL ================= */
#rail {
  width:80px;
  padding:20px 10px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;

  background: rgba(5,10,20,0.6);
  backdrop-filter: blur(20px);

  border-right:1px solid rgba(255,255,255,0.05);
}

.icon {
  width:50px;
  height:50px;

  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  background: rgba(255,255,255,0.06);

  cursor:pointer;
  transition:0.3s;
}

.icon:hover {
  transform:scale(1.1);
  box-shadow:0 0 15px rgba(88,101,242,0.5);
}

.icon.active {
  background:#5865f2;
  box-shadow:0 0 20px #5865f2;
}

/* ================= SIDEBAR ================= */
#sidebar {
  width:260px;
  padding:25px;

  background: rgba(15,23,42,0.55);
  backdrop-filter: blur(20px);

  border-right:1px solid rgba(255,255,255,0.05);
}

/* server header */
.serverCard {
  margin-bottom:25px;
}

.serverTitle {
  font-size:18px;
  font-weight:bold;
}

.progress {
  margin-top:10px;
  height:6px;
  border-radius:10px;
  background:#111;
  overflow:hidden;
}

.progress span {
  display:block;
  height:100%;
  width:70%;
  background: linear-gradient(90deg,#5865f2,#7c8cff);
}

/* channels */
.channel {
  padding:8px;
  border-radius:8px;
  margin-bottom:5px;
  color:#aaa;
  cursor:pointer;
}

.channel:hover {
  background:rgba(255,255,255,0.05);
}

.channel.active {
  background:#5865f2;
  color:white;
}

/* ================= CHAT ================= */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* header */
#chatHeader {
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;

  background: rgba(15,23,42,0.4);
  backdrop-filter: blur(15px);
}

/* messages */
#messages {
  flex:1;
  padding:25px;
  overflow-y:auto;
}

/* message row */
.msg {
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.avatar {
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,#5865f2,#7c8cff);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* bubble */
.bubble {
  background: rgba(255,255,255,0.08);
  padding:12px 15px;
  border-radius:16px;

  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.06);

  max-width:400px;
}

/* ================= INPUT ================= */
#inputBar {
  margin:15px;
  padding:10px;
  border-radius:999px;

  display:flex;
  align-items:center;
  gap:10px;

  background: rgba(15,23,42,0.5);
  backdrop-filter: blur(20px);

  box-shadow:0 0 20px rgba(88,101,242,0.2);
}

#inputBar input {
  flex:1;
  background:none;
  border:none;
  color:white;
  outline:none;
}

#sendBtn {
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;

  background:linear-gradient(135deg,#5865f2,#7c8cff);

  color:white;
  cursor:pointer;

  box-shadow:0 0 15px rgba(88,101,242,0.6);
}

</style>
</head>

<body>

<div id="app">

  <!-- ICON RAIL -->
  <div id="rail">
    <div class="icon active">A</div>
    <div class="icon">🌌</div>
    <div class="icon">🪐</div>
    <div class="icon">+</div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="serverCard">
      <div class="serverTitle">Auralis Hub</div>
      <div class="progress"><span></span></div>
    </div>

    <div class="channel active"># general</div>
    <div class="channel"># random</div>
  </div>

  <!-- CHAT -->
  <div id="chat">

    <div id="chatHeader">
      <div># general</div>
      <div>🔍 📌 👥 ⋮</div>
    </div>

    <div id="messages">
      <div class="msg">
        <div class="avatar">A</div>
        <div class="bubble">Welcome to Auralis 🚀</div>
      </div>
    </div>

    <div id="inputBar">
      <div>＋</div>
      <input placeholder="Message #general">
      <button id="sendBtn">➤</button>
    </div>

  </div>

</div>

</body>
</html>
