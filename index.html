<!DOCTYPE html>
<html>
<head>
  <title>Auralis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* BACKGROUND */
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(-45deg, #1e1f22, #2b2d31, #313338, #5865f2);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;

      transition: opacity 0.3s ease;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* PARTICLES */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* MAIN BOX */
    #container {
      text-align: center;
      padding: 40px;
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);

      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    /* LOGO */
    img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;

      box-shadow: 0 0 20px rgba(88,101,242,0.8);
      animation: pop 0.8s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* TEXT */
    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    /* BUTTONS */
    button {
      width: 200px;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #5865f2, #4752c4);
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;

      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(88,101,242,0.5);
    }

    button:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 10px 20px rgba(88,101,242,0.4);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

<canvas id="particles"></canvas>

<div id="container">

  <img src="Auralis-Logo.png">

  <h1>Auralis</h1>
  <p>Voice & Chat Platform</p>

  <button onclick="goLogin()">→ Login</button><br>
  <button onclick="goSignup()">＋ Sign Up</button>

</div>

<script>
/* PAGE TRANSITION */
function fadeAndGo(page) {
  document.body.style.opacity = "0";
  setTimeout(() => {
    window.location.href = page;
  }, 300);
}

function goLogin() {
  fadeAndGo("login.html");
}

function goSignup() {
  fadeAndGo("signup.html");
}

/* PARTICLES */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2,
    speed: Math.random() * 0.5
  });
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

    p.y -= p.speed;

    if (p.y < 0) {
      p.y = canvas.height;
      p.x = Math.random() * canvas.width;
    }
  });

  requestAnimationFrame(animateParticles);
}

animateParticles();
</script>

</body>
</html>
