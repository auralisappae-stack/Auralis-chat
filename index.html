<!DOCTYPE html>
<html>
<head>
<title>Auralis</title>

<style>
body {
  margin:0;
  height:100vh;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;

  background: 
    linear-gradient(rgba(2,6,23,0.7), rgba(2,6,23,0.9)),
    url("https://images.unsplash.com/photo-1446776811953-b23d57bd21aa");

  background-size: cover;
  background-position: center;
}

/* 🎬 ORBS */
.orb {
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:0.4;
}

.orb1 {
  width:400px;
  height:400px;
  background:#5865f2;
  top:-100px;
  left:-100px;
}

.orb2 {
  width:300px;
  height:300px;
  background:#7289da;
  bottom:-100px;
  right:-100px;
}

/* 💎 MAIN BOX */
#box {
  position:relative;
  z-index:1;

  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);

  padding:40px;
  border-radius:20px;
  text-align:center;
  width:280px;
}

/* BUTTONS */
button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;

  background:#5865f2;
  color:white;
  cursor:pointer;
  font-size:14px;

  transition: all 0.25s ease;

  box-shadow: 0 0 20px rgba(88, 101, 242, 0.2);
}


button:hover {
  background:#4752c4;

  box-shadow: 
    0 0 30px rgba(88, 101, 242, 0.4),
    0 0 60px rgba(88, 101, 242, 0.2);

  transform: translateY(-2px);
}

</style>
</head>

<body>

<!-- 🎬 BACKGROUND -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div id="box">

  <!-- 🖼️ LOGO -->
  <img src="Auralis-Logo.png" 
       style="width:80px;border-radius:20px;margin-bottom:10px;">

  <h1>Auralis</h1>
  <p style="color:#aaa;font-size:14px;">Connect. Chat. Experience.</p>

  <button onclick="goLogin()">Login</button>
  <button onclick="goSignup()">Sign Up</button>

</div>

<script>
function goLogin(){
  window.location = "login.html";
}

function goSignup(){
  window.location = "signup.html";
}
</script>

</body>
</html>
