<!DOCTYPE html>
<html>
<head>
  <title>Auralis</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* BACKGROUND */
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(-45deg, #1e1f22, #2b2d31, #313338, #5865f2);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* MAIN BOX */
    #container {
      text-align: center;
      padding: 40px;
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);

      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    /* LOGO */
    img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;

      box-shadow: 0 0 20px rgba(88,101,242,0.8);
    }

    /* TITLE */
    h1 {
      margin-bottom: 30px;
    }

    /* BUTTONS */
    button {
      width: 200px;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #5865f2;
    }
  </style>
</head>

<body>

<div id="container">

  <!-- LOGO -->
  <img src="logo.png">

  <!-- TITLE -->
  <h1>Auralis</h1>

  <!-- BUTTONS -->
  <button onclick="goLogin()">Login</button><br>
  <button onclick="goSignup()">Sign Up</button>

</div>

<script>
function goLogin() {
  window.location.href = "login.html";
}

function goSignup() {
  window.location.href = "signup.html";
}
</script>

</body>
</html>
