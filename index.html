<!DOCTYPE html>
<html>
<head>
  <title>Auralis</title>

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5865f2">

  <!-- App Icon -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #1e1f22;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #container {
      text-align: center;
      width: 300px;
    }

    img {
      margin-bottom: 10px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border: none;
      cursor: pointer;
      background: #5865f2;
      color: white;
      border-radius: 6px;
    }

    button:hover {
      background: #4752c4;
    }
  </style>
</head>

<body>

<div id="container">
  <img src="Auralis-Logo.png"  style= "width:90px; border-radius: 50%; ">
  <h1>Auralis</h1>
  <p>Voice & Chat Platform</p>

  <button onclick="goLogin()">Login</button>
  <button onclick="goSignup()">Sign Up</button>
</div>

<script>
function goLogin() {
  window.location.href = "login.html";
}

function goSignup() {
  window.location.href = "signup.html";
}
</script>

</body>
</html>
