<!DOCTYPE html>
<html>
<head>
  <title>Login - Auralis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      background: #0f1115;
    }

    /* 🎬 GLOW ORBS */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.5;
      animation: move 20s infinite alternate ease-in-out;
    }

    .orb1 {
      width: 500px;
      height: 500px;
      background: #5865f2;
      top: -100px;
      left: -100px;
    }

    .orb2 {
      width: 400px;
      height: 400px;
      background: #7289da;
      bottom: -120px;
      right: -100px;
      animation-delay: 5s;
    }

    .orb3 {
      width: 300px;
      height: 300px;
      background: #4752c4;
      top: 50%;
      left: 60%;
      animation-delay: 10s;
    }

    @keyframes move {
      0% { transform: translate(0, 0); }
      100% { transform: translate(80px, 60px); }
    }

    /* PARTICLES */
    #particles {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* MAIN BOX */
    #container {
      position: relative;
      z-index: 1;

      width: 300px;
      text-align: center;
      padding: 40px;
      border-radius: 15px;

      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);

      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    /* LOGO */
    img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 15px;

      box-shadow: 0 0 30px rgba(88,101,242,1);
    }

    /* INPUTS */
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;

      background: #1e1f22;
      color: white;
      outline: none;
    }

    input:focus {
      box-shadow: 0 0 8px #5865f2;
    }

    /* PASSWORD TOGGLE */
    .password-box {
      position: relative;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 12px;
      cursor: pointer;
      color: #aaa;
    }

    /* BUTTON */
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;

      background: linear-gradient(135deg, #5865f2, #4752c4);
      color: white;
      font-weight: bold;
      cursor: pointer;

      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(88,101,242,0.5);
    }

    /* LINK */
    .link {
      margin-top: 15px;
      color: #aaa;
      cursor: pointer;
      font-size: 14px;
    }

    .link:hover {
      color: white;
    }
  </style>
</head>

<body>

<!-- 🎬 BACKGROUND -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<canvas id="particles"></canvas>

<div id="container">

  <img src="Auralis-Logo.png">

  <h2>Welcome Back</h2>
  <p style="color:#aaa;">Login to Auralis</p>

  <input id="username" placeholder="Username">

  <div class="password-box">
    <input id="password" type="password" placeholder="Password">
    <span class="toggle" onclick="togglePassword()">👁️</span>
  </div>

  <button onclick="login()">Login</button>

  <div class="link" onclick="goSignup()">
    Don't have an account? Sign Up
  </div>

</div>

<script>
function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  const ws = new WebSocket("wss://auralis-chat.onrender.com");

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: "login",
      username: user,
      password: pass
    }));
  };

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.success) {
      alert("Login successful!");
      window.location.href = "chat.html";
    } else {
      alert("Login failed");
    }
  };
}

function goSignup() {
  window.location.href = "signup.html";
}

/* PARTICLES */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2,
    speed: Math.random() * 0.5
  });
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

    p.y -= p.speed;

    if (p.y < 0) {
      p.y = canvas.height;
      p.x = Math.random() * canvas.width;
    }
  });

  requestAnimationFrame(animateParticles);
}

animateParticles();
</script>

</body>
</html>
