<!DOCTYPE html>
<html>
<head>
<title>Login - Auralis</title>

<style>
body {
  margin:0;
  height:100vh;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;

  background: radial-gradient(circle at top, #0f172a, #020617);
  color:white;
}

/* 🎬 GLOW ORBS */
.orb {
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:0.4;
}

.orb1 {
  width:400px;
  height:400px;
  background:#5865f2;
  top:-100px;
  left:-100px;
}

.orb2 {
  width:300px;
  height:300px;
  background:#7289da;
  bottom:-100px;
  right:-100px;
}

/* 💎 GLASS BOX */
#box {
  position:relative;
  z-index:1;

  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);

  padding:30px;
  border-radius:15px;
  width:260px;
  text-align:center;
}

/* INPUT */
input {
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  background:#1e1f22;
  color:white;
  outline:none;
}

/* PASSWORD WRAP */
.password-box {
  position:relative;
}

/* 👁️ ICON */
.toggle {
  position:absolute;
  right:10px;
  top:10px;
  cursor:pointer;
  color:#aaa;
}

/* BUTTON */
button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#5865f2;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#4752c4;
}
</style>
</head>

<body>

<!-- 🎬 BACKGROUND -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div id="box">
  <h2>Login</h2>

  <input id="username" placeholder="Username">

  <!-- 🔁 UPDATED PASSWORD FIELD -->
  <div class="password-box">
    <input id="password" type="password" placeholder="Password">
    <span class="toggle" onclick="togglePassword()">👁️</span>
  </div>

  <button onclick="login()">Login</button>
</div>

<script>
/* 👁️ TOGGLE */
function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

/* LOGIN (same logic as before) */
function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  const savedUser = localStorage.getItem("username");
  const savedPass = localStorage.getItem("password");

  if(user === savedUser && pass === savedPass){
    window.location = "chat.html";
  } else {
    alert("Wrong login");
  }
}
</script>

</body>
</html>
