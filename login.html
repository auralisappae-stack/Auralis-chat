<!DOCTYPE html>
<html>
<head>
<title>Login - Auralis</title>

<style>
body {
  margin:0;
  height:100vh;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;

  background:
    linear-gradient(rgba(2,6,23,0.75), rgba(2,6,23,0.95)),
    url("https://images.unsplash.com/photo-1446776811953-b23d57bd21aa");

  background-size: cover;
  background-position: center;
}

/* 💎 BOX (same as signup) */
#box {
  width: 280px;
  padding: 30px;
  border-radius: 20px;

  display: flex;              /* 🔥 add this */
  flex-direction: column;     /* 🔥 stack items */
  align-items: center;        /* 🔥 CENTER everything */

  text-align: center;

  background: rgba(15, 17, 25, 0.75);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 0 40px rgba(88, 101, 242, 0.15),
    0 0 80px rgba(88, 101, 242, 0.05);
}

/* INPUT */
#box input {

  max-width: 240px;
  padding: 10px;
  margin: 8px 0;

  border: none;
  border-radius: 8px;
  background: #1e1f22;
  color: white;

  box-sizing: border-box; /* 🔥 IMPORTANT */
}

/* PASSWORD BOX */
.password-box {
  
  max-width: 240px;
  margin: 8px 0;
  position: relative;
}

.password-box input {

  max-width: 240px;
  padding: 12px;
  padding-right: 40px; /* space for eye */
  border: none;
  border-radius: 8px;
  background: #1e1f22;
  color: white;
  outline: none;


  box-sizing: border-box; /* 🔥 IMPORTANT FIX */

}

#box input,
.password-box,
#box button {
  width: 100%;
  max-width: 240px;
    margin: 6px 0;
  box-sizing: border-box; /* 🔥 important */
}

.toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
}

.eye {
  width: 20px;
  height: 20px;
  stroke: #aaa;
  transition: 0.2s;
}

.toggle:hover .eye {
  stroke: white;
}

/* BUTTON */
button {
  
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;

  background: linear-gradient(135deg, #5865f2, #6c7bff);
  color:white;
  cursor:pointer;

  transition: all 0.25s ease;

  box-shadow: 0 0 20px rgba(88, 101, 242, 0.25);
}

button:hover {
  box-shadow: 
    0 0 40px rgba(88, 101, 242, 0.5),
    0 0 80px rgba(88, 101, 242, 0.2);

  transform: translateY(-2px);
}

/* ERROR MESSAGE */
#error {
  color:#ff6b6b;
  font-size:13px;
  display:none;
  text-align:left;
}

.loginContainer{
  height:100vh;
  display:flex;
  align-items:center;     /* vertical center */
  justify-content:center; /* horizontal center */
}

.loginBox{
  width:300px;
  padding:30px;
  border-radius:16px;

  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);

  display:flex;
  flex-direction:column;
  gap:12px;
}

.backBtn {
  width: 100%;
  padding: 10px;
  margin-top: 8px;

  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);

  background: rgba(255,255,255,0.05);
  color: #cbd5f5;

  cursor: pointer;
  transition: all 0.25s ease;

  box-shadow: 0 0 0 rgba(88, 101, 242, 0); /* base */
}

.backBtn:hover {
  border-color: rgba(88, 101, 242, 0.6);

  box-shadow:
    0 0 10px rgba(88, 101, 242, 0.3),
    0 0 20px rgba(88, 101, 242, 0.15);

  background: rgba(255,255,255,0.08);
}




</style>
</head>

<body>



<div id="box">

  <img src="Auralis-Logo.png" 
       style="width:70px;border-radius:15px;margin-bottom:10px;">

  <h2>Welcome Back</h2>

  <input id="username" placeholder="Username">

  <!-- PASSWORD -->
  <div class="password-box">
    <input id="password" type="password" placeholder="Password">
    <span class="toggle" onclick="togglePassword('password', this)">
      <svg class="eye" viewBox="0 0 24 24">
        <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </span>
  </div>

  <!-- ERROR MESSAGE -->
  <p id="error"></p>

  <button onclick="login()">Login</button>

  <button class="backBtn" onclick="goBack()">Go Back</button>

</div>

<script>

/* 👁️ TOGGLE */
function togglePassword(id, el) {
  const input = document.getElementById(id);
  const svg = el.querySelector("svg");

  if (input.type === "password") {
    input.type = "text";
    svg.innerHTML = `
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    `;
  } else {
    input.type = "password";
    svg.innerHTML = `
      <path d="M2 2l20 20"/>
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7"/>
    `;
  }
}

/* 🔐 LOGIN FUNCTION */
function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();
  const error = document.getElementById("error");

  error.style.display = "none";

  const savedUser = localStorage.getItem("username");
  const savedPass = localStorage.getItem("password");

  if (user === "" || pass === "") {
    error.innerText = "Please enter username and password";
    error.style.display = "block";
    return;
  }

  if (user !== savedUser || pass !== savedPass) {
    error.innerText = "Invalid login credentials";
    error.style.display = "block";
    return;
  }

  // ✅ SUCCESS
  error.style.color = "#4CAF50";
  error.innerText = "Login successful!";
  error.style.display = "block";

 setTimeout(() => {

  localStorage.setItem(
    "username",
    user
  );

  window.location =
  "chat_v2.html";

}, 1000);
}


  function goBack() {
  window.location = "index.html"; // or login.html
}

</script>

</body>
</html>
