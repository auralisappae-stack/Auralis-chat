<!DOCTYPE html>
<html>
<head>
  <title>Login - Auralis</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #1e1f22;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #box {
      width: 300px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #5865f2;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div id="box">
  <h2>Login</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<script>
function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  const ws = new WebSocket("wss://auralis-chat.onrender.com");

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: "login",
      username: user,
      password: pass
    }));
  };

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.success) {
      localStorage.setItem("username", user);
      window.location.href = "chat.html";
    } else {
      alert("Login failed");
    }
  };
}
</script>

</body>
</html>
