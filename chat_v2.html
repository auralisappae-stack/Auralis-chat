<!DOCTYPE html>
<html>
<head>

<link
href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
rel="stylesheet">

<meta charset="UTF-8">
<title>Auralis Chat V2</title>

<style>

  /* main theme */
  :root{

  /* Main */
  --bg-main: #0B0620;
  --bg-card: #161033;
  --bg-elevated: #24184A;

  /* Accent */
  --purple: #8B5CF6;
  --purple-light: #A15CFF;
  --purple-soft: #B56CFF;

  /* Pink */
  --pink: #FF7EDB;
  --pink-light: #FF9FEA;

  /* Text */
  --text-main: #FFFFFF;
  --text-soft: #D7B8FF;
  --text-muted: #C5C0E8;

  /* Status */
  --online: #39D98A;

  /* Gradients */
  --main-gradient:
    linear-gradient(
      135deg,
      #8B5CF6,
      #FF7EDB
    );
}

body{
  margin:0;
  height:100vh;

  background:#0B0620;
  color:white;
  font-family:Arial,sans-serif;

  display:flex;

}

#app{
  width:90%;
  height:90vh;

  display:flex;

  background:#161033;

  border-radius:24px;

  overflow:hidden;

  border:1px solid rgba(215,184,255,.12);

  box-shadow:
    0 0 40px rgba(139,92,246,.15),
    0 20px 60px rgba(0,0,0,.45);
}


.search-wrap{
  padding:16px;
  
}

.search-box{
    width:100%;
    height:54px;
    box-sizing:border-box;

    background:#120C2A;

    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;

    padding-left:50px;
    padding:0 18px 0 56px;

    color:white;
}

.search-box::placeholder{
  color:#C5C0E8;
}

.search-box:focus{
  border-color:#8B5CF6;

  box-shadow:
    0 0 0 2px rgba(139,92,246,.15),
    0 0 20px rgba(139,92,246,.25);
}


.search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);

    color:#C5C0E8;
    font-size:20px;
}

.search-inner{
  position:relative;
  width:100%;
}



.chat-list{
  flex:1;

  overflow-y:auto;

  padding:8px 0;

  scrollbar-width:none;
}

.chat-list::-webkit-scrollbar{
  display:none;
}

.search-input{
  width:100%;
  height:42px;

  border-radius:18px;

  background:#161033;

  border:1px solid rgba(215,184,255,.15);

  color:#FFFFFF;

  padding:0 16px;

  outline:none;

  transition:.25s;
}

.search-input:focus{
  border-color:#8B5CF6;

  box-shadow:
    0 0 0 2px rgba(139,92,246,.15),
    0 0 18px rgba(139,92,246,.25);
}


 .chat-item{
  display:flex;
  align-items:center;
  gap:12px;

  padding:12px 14px;

  cursor:pointer;

  border-radius:16px;

  margin:6px 8px;

  position:relative;

  background:#161033;

  border:1px solid rgba(215,184,255,.08);

  transition:.25s;
}

.chat-item:hover{
  background:#24184A;

  transform:translateY(-1px);

  border-color:rgba(139,92,246,.35);
}

.chat-item.active{
  background:#24184A;

  border-left:3px solid #8B5CF6;

  box-shadow:
    0 0 20px rgba(139,92,246,.18);
}


 .chat-avatar{
  width:44px;
  height:44px;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #8B5CF6,
    #FF7EDB
  );

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-weight:bold;
  font-size:18px;

  flex-shrink:0;
  position:relative;

  box-shadow:
    0 0 12px rgba(139,92,246,.35),
    0 0 24px rgba(255,126,219,.15);
}

  .badge{
  background:linear-gradient(
    135deg,
    #8B5CF6,
    #FF7EDB
  );

  color:#FFFFFF;

  font-size:10px;
  font-weight:700;

  border-radius:999px;

  padding:3px 7px;

  min-width:18px;

  text-align:center;

  margin-left:auto;

  box-shadow:
    0 0 10px rgba(139,92,246,.35);
}

.chat-info{
  flex:1;
  min-width:0;
}

.chat-item:hover{
  background:#24184A;

  border-color:rgba(139,92,246,.35);

  box-shadow:
    0 0 18px rgba(139,92,246,.12);

  transform:translateY(-1px);
}

.chat-item.active{
  background:#24184A;

  border-left:3px solid #8B5CF6;

  box-shadow:
    0 0 20px rgba(139,92,246,.18);
}

.sidebar-footer{
  padding:14px 16px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:#161033;

  border-top:1px solid rgba(215,184,255,.10);
}


.chat-actions{
  display:flex;
  flex-direction:row;
  gap:16px;
}


.new-chat-btn,
.create-group-btn{
  width:170px;
  height:56px;
  border-radius:16px;
}



.new-chat-btn:hover{
  transform:translateY(-1px);

  box-shadow:
    0 0 24px rgba(139,92,246,.35);
}

.icon-btn{
  background:#161033;

  border:1px solid rgba(215,184,255,.10);

  cursor:pointer;

  color:#D7B8FF;

  padding:8px;

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.25s;
}

.icon-btn:hover{
  background:#24184A;

  color:#FFFFFF;

  border-color:#8B5CF6;

  box-shadow:
    0 0 14px rgba(139,92,246,.20);
}



#userCard{
  display:flex;
  align-items:center;
  gap:12px;

  padding:12px;

  background:#161033;

  border-top:1px solid rgba(215,184,255,.10);
}

#userAvatar{
  width:40px;
  height:40px;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #8B5CF6,
    #FF7EDB
  );

  display:flex;
  justify-content:center;
  align-items:center;

  color:#FFFFFF;

  font-weight:700;

  box-shadow:
    0 0 12px rgba(139,92,246,.35),
    0 0 20px rgba(255,126,219,.15);
}

.statusDot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#39D98A;

  box-shadow:
    0 0 8px rgba(57,217,138,.45);
}

#userInfo{
  flex:1;

  display:flex;
  flex-direction:column;
  justify-content:center;

  min-width:0;
}

#userName{
  color:#FFFFFF;

  font-size:14px;
  font-weight:700;

  letter-spacing:.3px;
}

#userStatus{
  display:flex;
  align-items:center;
  gap:6px;

  margin-top:4px;

  color:#C5C0E8;

  font-size:12px;
}

#chatArea{
  flex:1;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  background:#161033;

  display:flex;
  flex-direction:column;

  position:relative;

   flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

#header{
  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:linear-gradient(
    180deg,
    #161033,
    #0B0620
  );

  border-bottom:1px solid rgba(215,184,255,.10);

  box-shadow:
    0 2px 20px rgba(0,0,0,.25);
}


#messages{
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
    
  flex:1;

  display:flex;
  flex-direction:column;

  padding:16px;
  box-sizing:border-box;

  gap:14px;

  overflow-y:auto;
  min-height:0;

  scrollbar-width:none;
  -ms-overflow-style:none;
}

#messages::-webkit-scrollbar{
  display:none;
}

#messages::before{
  content:"";

  position:absolute;

  inset:0;

  background:
    radial-gradient(
      circle at top right,
      rgba(139,92,246,.08),
      transparent 35%
    ),
    radial-gradient(
      circle at bottom left,
      rgba(255,126,219,.05),
      transparent 40%
    );

  pointer-events:none;
}


#inputBar{
  padding:16px;

  display:flex;
  align-items:center;
  gap:10px;

  background:#0B0620;

  border-top:1px solid rgba(215,184,255,.10);

  backdrop-filter:blur(12px);
}

#msgInput{
  flex:1;

  padding:14px 18px;

  border:1px solid rgba(215,184,255,.12);

  border-radius:16px;

  background:#161033;

  color:#FFFFFF;

  outline:none;

  transition:.25s;
}

#msgInput::placeholder{
  color:#C5C0E8;
}

#msgInput:focus{
  border-color:#8B5CF6;

  box-shadow:
    0 0 12px rgba(139,92,246,.25);

  background:#24184A;
}

.inputIcon{
  width:42px;
  height:42px;

  border:none;
  border-radius:12px;

  background:#1e293b;

  color:white;

  cursor:pointer;
}

.inputIcon,
#sendBtn{
  width:46px;
  height:46px;

  border:none;

  border-radius:14px;

  cursor:pointer;

  transition:.25s;
}


.inputIcon:hover,
#sendBtn:hover{
  transform:scale(1.05);
}

.inputIcon:hover{
  background:#24184A;
  color:#FFFFFF;
}


.bubble{
  position:relative;

  max-width:70%;

  padding:12px 16px;

  border-radius:18px;

  color:#FFFFFF;

  backdrop-filter:blur(12px);

  border:1px solid rgba(215,184,255,.10);

  box-shadow:
    0 6px 20px rgba(0,0,0,.25);

  animation:fadeIn .25s ease;

  transition:.25s;
}



.bubble.other{
  background:#24184A;

  border:1px solid rgba(255,126,219,.10);

   align-self:flex-start;
  margin-right:auto;

}

.bubble.me{
  background:linear-gradient(
    135deg,
    #8B5CF6,
    #A15CFF
  );

  box-shadow:
    0 0 18px rgba(139,92,246,.25);

    align-self:flex-end;

  margin-left:auto !important;
}

.bubble:hover{
  transform:translateY(-1px);

  box-shadow:
    0 8px 24px rgba(0,0,0,.30);
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.decor{
  position:absolute;

  right:-8px;
  top:-8px;

  font-size:20px;
}

/*new chat button CSS */

 .sidebar {
    width: 320px;
    min-width: 320px;
    background:#0B0620;
    border-right:1px solid rgba(255,255,255,.08);
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  #sidebarBottom{
  width:100%;
  box-sizing:border-box;
}

  .sidebar-header {
    padding: 18px 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }


#userStatus{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:12px;
  color:#94a3b8;
}



#userActions{
  display:flex;
  gap:4px;
}

#userActions button{
  background:transparent;
  border:none;

  color:white;

  cursor:pointer;

  font-size:18px;
}


.chat-item.active{
  background:#24184A;
  border-left:3px solid #8B5CF6;
}



.chat-info{
  flex:1;
}

.chat-name{
  font-weight:600;
}

.chat-preview{
  color:#a89ec0;
  font-size:13px;
}

.chat-meta{
  text-align:right;
}

.chat-time{
  font-size:12px;
  color:#a89ec0;
}




.chatTime{
  font-size:11px;
  color:#94a3b8;
}

.unreadBadge{
  margin-top:6px;

  width:20px;
  height:20px;

  border-radius:50%;

  background:#5865f2;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:11px;
}


#headerLeft{
  display:flex;
  align-items:center;
  gap:12px;
}

#headerAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#5865f2;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  padding:0;
  overflow:hidden;
}

#headerAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

#headerName{
  font-weight:bold;
  color:white;
}

#headerStatus{
  font-size:12px;
  color:#22c55e;
}

#headerActions{
  display:flex;
  gap:8px;
}

#headerActions button{
  width:38px;
  height:38px;

  border:none;
  border-radius:10px;

  background:#1e293b;
  color:white;

  cursor:pointer;
}

#headerActions button:hover{
  background:#334155;
}

.msgHeader{
  display:flex;
  gap:10px;

  margin-bottom:6px;

  align-items:center;
}

.msgUser{
  color:#FFFFFF;
  font-weight:700;
}

.msgTime{
  color:#D7B8FF;
  opacity:.8;
}

.msgText{
  color:#FFFFFF;
  line-height:1.6;
}

.avatar-circle{
  width:40px;
  height:40px;

  border-radius:50%;

  display:none;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  color:#FFFFFF;

  font-weight:700;

  background:linear-gradient(
    135deg,
    #8B5CF6,
    #FF7EDB
  );

  box-shadow:
    0 0 16px rgba(139,92,246,.35);

  border:2px solid rgba(255,255,255,.10);
}


.avatar-circle:hover{
  transform:scale(1.05);

  box-shadow:
    0 0 24px rgba(255,126,219,.45);

  transition:.25s;
}


.sidebar-header{
    margin:16px;
    padding:18px;

    background:#161033;
    border-radius:24px;

    display:flex;
    flex-direction:column;
    gap:16px;

    align-items:stretch;
    width:auto;

    border:1px solid rgba(255,255,255,.14);
}


.header-name-wrap{
  display:flex;

  flex-direction:column;

  justify-content:center;

  gap:4px;
}

.header-name{
  color:#FFFFFF;

  font-size:18px;

  font-weight:700;

  letter-spacing:.4px;
}

.status-row{
  display:flex;

  align-items:center;

  gap:6px;
}

.status-dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:#39D98A;

  box-shadow:
    0 0 10px rgba(57,217,138,.45);
}

.status-text{
  color:#C5C0E8;

  font-size:13px;

  font-weight:500;
}

.headerIcon{
  width:40px;
  height:40px;

  cursor:pointer;

  object-fit:contain;

  padding:8px;

  border-radius:12px;

  transition:.25s;

  background:transparent;
}

.headerIcon:hover{
  background:#24184A;

  transform:scale(1.05);

  box-shadow:
    0 0 14px rgba(139,92,246,.25);
}

/*Friend List Panel */
#friendsPanel{
  width:320px;
  min-width:320px;

  height:100vh;

  background:#0B0620;

  color:#FFFFFF;

  display:none;

  flex-direction:column;

  border-left:1px solid rgba(215,184,255,.08);

  box-shadow:
    -10px 0 30px rgba(0,0,0,.35);
}

#friendsHeader{
  padding:20px;

  font-size:20px;

  font-weight:700;

  color:#FFFFFF;

  background:#161033;

  border-bottom:1px solid rgba(215,184,255,.08);
}

#friendsList{
  padding:12px;

  overflow-y:auto;
}

.friend-item{
  display:flex;

  align-items:center;

  gap:12px;

  padding:12px;

  border-radius:14px;

  background:#161033;

  margin-bottom:8px;

  transition:.25s;
}

.friend-item{
  display:flex;
  align-items:center;

  gap:12px;

  padding:12px 14px;

  border-radius:14px;

  cursor:pointer;

  background:#161033;

  color:#FFFFFF;

  border:1px solid rgba(215,184,255,.08);

  transition:.25s;
}

.friend-item:hover{
  background:#24184A;

  transform:translateX(2px);

  box-shadow:
    0 0 14px rgba(139,92,246,.20);
}

/* pending re btn*/
#pendingBtn img {
  width: 24px;
  height: 24px;
}

/*  pending req panel  */

#requestsPanel{
  margin-top:20px;

  padding:16px;

  border-radius:16px;

  background:#161033;

  color:#FFFFFF;

  border:1px solid rgba(215,184,255,.08);

  box-shadow:
    0 8px 24px rgba(0,0,0,.25);
}


#requestsPanel h3{
  margin:0 0 14px;

  color:#D7B8FF;

  font-size:18px;

  font-weight:700;
}

.requestItem{
  display:flex;

  align-items:center;

  gap:12px;

  padding:12px;

  margin-bottom:10px;

  border-radius:14px;

  background:#24184A;

  transition:.25s;
}

.requestAvatar{
  width:36px;
  height:36px;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #8B5CF6,
    #FF7EDB
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:700;

  color:#FFFFFF;
}

.requestItem:hover{
  transform:translateX(2px);

  box-shadow:
    0 0 12px rgba(139,92,246,.20);
}

.requestInfo{
  flex:1;
}

.requestName{
  font-weight:700;

  color:#FFFFFF;

  font-size:14px;
}

.requestText{
  font-size:12px;

  color:#C5C0E8;

  margin-top:2px;
}


.acceptBtn,
.declineBtn{
  width:30px;
  height:30px;

  border:none;

  border-radius:10px;

  color:white;

  cursor:pointer;

  transition:.25s;
}

.acceptBtn{
  background:linear-gradient(
    135deg,
    #8B5CF6,
    #FF7EDB
  );

  box-shadow:
    0 0 10px rgba(139,92,246,.25);
}

.acceptBtn:hover{
  transform:scale(1.08);

  box-shadow:
    0 0 16px rgba(255,126,219,.35);
}

.declineBtn{
  background:#24184A;

  border:1px solid rgba(215,184,255,.12);

  color:#D7B8FF;
}

.declineBtn:hover{
  background:#161033;

  transform:scale(1.08);

  border-color:rgba(255,126,219,.25);
}

.sidebar-header-card{
  margin:16px;
  padding:16px;

  background:#161033;
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;

  display:flex;
  flex-direction:column;
  gap:14px;
}

.profile-row{
  display:flex;
  align-items:center;
  gap:14px;
}

/* chat filter CSS*/
.chat-filters{
  display: flex;
  gap: 8px;
  padding: 12px;
  flex-wrap: wrap;
}

.filter-btn{
  flex:1;

  height:36px;

  border:none;
  border-radius:12px;

  background:#24184A;

  color:#C5C0E8;

  font-size:13px;
  font-weight:600;

  cursor:pointer;

  transition:.25s;
}

.filter-btn:hover{
  background:#322063;
  color:#FFFFFF;
}

.filter-btn.active{
  background:linear-gradient(
    135deg,
    #8B5CF6,
    #FF7EDB
  );

  color:white;

  box-shadow:
    0 0 12px rgba(139,92,246,.25);
}


.new-chat-btn {
  background: rgba(22,16,51,.85);
  border: 1px solid rgba(139,92,246,.35);

  color: #D7B8FF;

  border-radius: 16px;
  padding: 14px 24px;

  font-weight: 600;
  font-size: 15px;

  transition: .25s ease;
}

.new-chat-btn:hover {
  background: rgba(36,24,74,.95);
  border-color: #8B5CF6;

  transform: translateY(-2px);

  box-shadow:
    0 0 15px rgba(139,92,246,.25);
}
.create-group-btn {
  background: linear-gradient(
    135deg,
    #8B5CF6,
    #A15CFF,
    #FF7EDB
  );

  border: none;

  color: white;

  border-radius: 16px;
  padding: 0 18px;

  font-weight: 700;
  font-size: 15px;

  box-shadow:
    0 0 20px rgba(255,126,219,.25);

  transition: .25s ease;
}

.create-group-btn:hover {
  transform:
    translateY(-2px)
    scale(1.02);

  box-shadow:
    0 0 25px rgba(181,108,255,.45),
    0 0 40px rgba(255,126,219,.25);
}


/*  CSS of the group btn page */

.group-modal{
  display:none;
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.55);

  justify-content:center;
  align-items:center;

  z-index:9999;
}
.group-modal-content{
  width:620px;
  max-width:90vw;
  max-height:85vh;

  overflow-y:auto;

  background:linear-gradient(
    180deg,
    #171033,
    #100a24
  );

  border:1px solid rgba(139,92,246,.35);
  border-radius:24px;

  padding:28px;
  color:white;

  box-shadow:
    0 0 40px rgba(139,92,246,.25),
    0 20px 70px rgba(0,0,0,.55);

  scrollbar-width:none;
}

.group-modal-content::-webkit-scrollbar{
  display:none;
}

.close-modal-btn{
  float:right;
  background:none;
  border:none;
  color:white;
  font-size:22px;
  cursor:pointer;
}

#closeGroupModal{
  background:none;
  border:none;
  color:white;
  font-size:24px;
  cursor:pointer;

document.addEventListener("click", async (e) => {

  if (!e.target.classList.contains("declineBtn"))
    return;

  const requestId =
    e.target.dataset.id;

  await db
    .collection("friendRequests")
    .doc(requestId)
    .delete();

});


document.addEventListener("click", async (e) => {

  if (!e.target.classList.contains("acceptBtn"))
    return;

  const requestId =
    e.target.dataset.id;

  const requestDoc = await db
  .collection("friendRequests")
  .doc(requestId)
  .get();

const request = requestDoc.data();

console.log("Accepting:", request);

await db
  .collection("users")
 .doc(auth.currentUser.uid)
  .collection("friends")
  .add({
    username: request.from
  });

  await db
  .collection("friendRequests")
  .doc(requestId)
  .delete();

});

document.addEventListener("DOMContentLoaded", () => {

    document.getElementById("memberSearchInput");

  memberSearchInput.addEventListener("input", () => {
    const search = memberSearchInput.value.toLowerCase();

    document.querySelectorAll(".member-item")
      .forEach(member => {
        member.style.display =
          member.dataset.user
            .toLowerCase()
            .includes(search)
            ? "block"
            : "none";
      });
  });
}); // of the membersearch listener
