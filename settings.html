<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Full Settings</title>

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#020617;
  color:white;
  display:flex;
}

/* sidebar */
#settingsNav{
  width:220px;
  background:#0f172a;
  padding:20px;
}

/* content */
#settingsMain{
  flex:1;
  padding:30px;
}


.navTitle{
  display: flex;
  align-items: center;
  gap: 8px;

  padding-left: 0; /* 🔥 align with items */
}

/* items */
.navItem{
  display: flex;
  align-items: center;
  gap: 10px;

  padding: 0px 0;
  cursor: pointer;
  opacity: 0.8;
}

.navColumn{
  display: flex;
  flex-direction: column;
  gap: 8px;
}



.navColumn h4{
  margin: 0;
  font-size: 14px;
  opacity: 0.6;
}

.navTitle h4,
.navItem span,
.navItem h4{
  margin: 0;
  font-size: 14px;
}

/* highlight the text of the overview on the left panel */

.navItem.active h4{
  color: #5865f2;
}

#settingsLayout{
  display:flex;
  height:100vh;
  background:#020617;
  color:white;
}

/* LEFT */
#settingsLeft{
  width:220px;
  padding:20px;
  background:#0f172a;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* CENTER (DYNAMIC) */
#settingsCenter{
  flex:1;
  padding:30px;
  overflow-y:auto;
}

/* RIGHT (FIXED PANEL) */
#settingsRight{
  width:300px;
  padding:20px;
  background:rgba(15,23,42,0.6);
  border-left:1px solid rgba(255,255,255,0.08);
}

/* NAV ITEMS */
.navItem{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  opacity:0.7;
   padding-left: 0;
}

.navItem:hover{
  background:rgba(255,255,255,0.05);
  opacity:1;
}

.navItem.active{
  background:rgba(88,101,242,0.2);
  opacity:1;
}

/* RIGHT ITEMS */
.rightItem{
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.05);
}

.settingsLayout{
  display: flex;
  width: 100%;
  height: 100%;
}

/* LEFT */
.leftPanel{
  width: 220px;
  padding-top: 40px;
  display: flex;
  flex-direction: column;
  gap: 8px;

   padding-left: 20px; /* 👈 ONE consistent left line */
}

/* CENTER (flexible) */
.centerPanel{
  flex: 1;
  padding: 60px 20px 20px; /* 👈 top space added */
}
/* RIGHT (push to edge) */
.rightPanel{
  width: 320px;
  margin-left: auto; /* 🔥 THIS pushes it all the way right */
}

.navItem{
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  opacity: 0.7;
}

.navIcon{
  width: 40px;
  height: 40px;
  object-fit: contain;
  opacity: 0.8;
}

</style>
</head>



<body>

<div class="settingsLayout">

  <!-- LEFT -->
  <div class="leftPanel">
<!-- OVERVIEW (TITLE ONLY) -->
<div class="navTitle">
  <img src="overview-icon.png" class="navIcon">
  <h4>Overview</h4>
</div>



<!-- ACCOUNT SECTION -->
<div class="navTitle">
  <h4>Account</h4>
</div>

<div class="navItem">My Account</div>
<div class="navItem">Profile</div>
<div class="navItem">Security</div>
  </div>

  <!-- CENTER -->
  <div class="centerPanel" id="dynamicContent">
    <h2>Overview</h2>
    <p>Select a section</p>
  </div>

  <!-- RIGHT -->
  <div class="rightPanel">
    <h3>App Settings</h3>

    <div class="rightItem">Theme</div>
    <div class="rightItem">Accent Color</div>
    <div class="rightItem">Language</div>
  </div>

</div>





<script>

    const content = document.getElementById("dynamicContent");

document.querySelectorAll(".navItem").forEach(item => {
  item.onclick = () => {

    // remove active
    document.querySelectorAll(".navItem")
      .forEach(i => i.classList.remove("active"));

    item.classList.add("active");

    const text = item.textContent;

    // 🔥 change center content
    if (text === "Overview") {
      content.innerHTML = "<p>This is overview page</p>";
    }

    if (text === "Account") {
      content.innerHTML = "<p>Account settings here</p>";
    }

    if (text === "Appearance") {
      content.innerHTML = "<p>Appearance settings here</p>";
    }

  };
});

</script>

</div>


</body>
</html>
