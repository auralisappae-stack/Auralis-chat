<!DOCTYPE html>
<html>
<head>
<title>Sign Up - Auralis</title>

<style>

body {
  margin:0;
  height:100vh;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;

  background:
    linear-gradient(rgba(2,6,23,0.75), rgba(2,6,23,0.95)),
    url("https://images.unsplash.com/photo-1446776811953-b23d57bd21aa");

  background-size: cover;
  background-position: center;
}
/* 🎬 ORBS */
.orb {
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:0.4;
   pointer-events: none; /* 👈 THIS fixes clicking */
}

.orb1 {
  width:400px;
  height:400px;
  background:#5865f2;
  top:-100px;
  left:-100px;
}

.orb2 {
  width:400px;
  height:400px;
  background:#7289da;
  bottom:-100px;
  right:-100px;
}

body {
  animation: zoom 25s infinite alternate;
}

@keyframes zoom {
  from { background-size: 100%; }
  to { background-size: 110%; }
}

/* 💎 BOX */
#box {
  width: 280px;
  padding: 30px;
  border-radius: 20px;

  display: flex;              /* 🔥 add this */
  flex-direction: column;     /* 🔥 stack items */
  align-items: center;        /* 🔥 CENTER everything */

  text-align: center;

  background: rgba(15, 17, 25, 0.75);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 0 40px rgba(88, 101, 242, 0.15),
    0 0 80px rgba(88, 101, 242, 0.05);
}

#box:hover {
  box-shadow:
    0 0 60px rgba(88, 101, 242, 0.25),
    0 0 120px rgba(88, 101, 242, 0.1);
  transition: 0.3s;
}

/* INPUT */

/* ALL INPUTS SAME WIDTH */
#box input {
  width: 100%;
  max-width: 240px;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  background:#1e1f22;
  color:white;
  outline:none;
}

.brand-glow {
  position: absolute;
  font-size: 120px;
  font-weight: bold;
  letter-spacing: 10px;
  color: rgba(255,255,255,0.03);
  pointer-events: none;
}

/* PASSWORD WRAPPER */
.password-box {
padding-right: 20px;
  width: 100%;
  max-width: 240px;
  position: relative;
}

/* SPACE FOR ICON */
.password-box input {
  width: 100%;
  padding: 10px;
  padding-right: 35px; /* space for eye */
  border: none;
  border-radius: 8px;
  background: #1e1f22;
  color: white;
  outline: none;
}

/* BUTTON */
button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#5865f2;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#4752c4;
}

.toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%); /* 🔥 perfect vertical center */
  cursor: pointer;
}

.eye {
  width: 20px;
  height: 20px;
  stroke: #aaa;
  transition: 0.2s;
}

/* go back button CSS */

.backBtn {
  width: 100%;
  padding: 10px;
  margin-top: 8px;

  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);

  background: rgba(255,255,255,0.05);
  color: #cbd5f5;

  cursor: pointer;
  transition: all 0.25s ease;

  box-shadow: 0 0 0 rgba(88, 101, 242, 0); /* base */
}

.backBtn:hover {
  border-color: rgba(88, 101, 242, 0.6);

  box-shadow:
    0 0 10px rgba(88, 101, 242, 0.3),
    0 0 20px rgba(88, 101, 242, 0.15);

  background: rgba(255,255,255,0.08);
}

</style>
</head>

<body>

<!-- 🎬 BACKGROUND -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div id="box">
  <h2>Create Account</h2>

  <input id="username" placeholder="Username">

  <!-- email input-->

  <input
  id="email"
  type="email"
  placeholder="Email Address">

  <!-- 👁️ PASSWORD -->
  <div class="password-box">
  <input id="password" type="password" placeholder="Password">
  <span class="toggle" onclick="togglePassword('password', this)">
    <!-- OPEN EYE -->
    <svg class="eye" viewBox="0 0 24 24">
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </span>
</div>

<div class="password-box">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">
  <span class="toggle" onclick="togglePassword('confirmPassword', this)">
    <svg class="eye" viewBox="0 0 24 24">
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </span>
</div>


<!-- for the sign up / go back btns-->

<p id="error"
   style="color:#ff6b6b; font-size:13px; display:none;">
</p>

<button onclick="signup()">Sign Up</button>

<button class="backBtn" onclick="goBack()">
  Go Back
</button>


<!-- firebase script-->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFZ0kdYk-HupIbGxTuY5EqE24xnwApEyc",
  authDomain: "auralis-web-app.firebaseapp.com",
  projectId: "auralis-web-app",
  storageBucket: "auralis-web-app.firebasestorage.app",
  messagingSenderId: "817840303664",
  appId: "1:817840303664:web:cc89d235f2ce1adcb307f5",
  measurementId: "G-N117VGDYMG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.doc = doc;
window.setDoc = setDoc;

</script>

<!-- personal script-->
<script>
/* 👁️ PASSWORD TOGGLE */
function togglePassword(id, el) {
  const input = document.getElementById(id);
  const svg = el.querySelector("svg");

  if (input.type === "password") {
    input.type = "text";

    // 👁️ OPEN EYE
    svg.innerHTML = `
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    `;
  } else {
    input.type = "password";

    // 🙈 CLOSED EYE (like your image)
    svg.innerHTML = `
      <path d="M2 2l20 20"/>
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7"/>
    `;
  }
}

/* SIGNUP */

async function signup() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();
  const confirm = document.getElementById("confirmPassword").value.trim();
  const email = document.getElementById("email").value.trim();
  const error = document.getElementById("error");





  // ✅ make sure error exists
  if (!error) {
    alert("Error element missing!");
    return;
  }

  // reset message
  error.style.display = "none";
  error.innerText = "";

  // 🏠 CREATE DEFAULT SERVER
const server = {
  name: user + "'s Server",
  icon: user.charAt(0).toUpperCase()
};

localStorage.setItem("server", JSON.stringify(server));

  // REQUIRED
  if (user === "" || pass === "" || confirm === "") {
    error.innerText = "Username and password are required!";
    error.style.display = "block";
    return;
  }

  // MATCH
  if (pass !== confirm) {
    error.innerText = "Passwords do not match!";
    error.style.display = "block";
    return;
  }

  // LENGTH
  if (pass.length < 8) {
    error.innerText = "Password must be at least 8 characters";
    error.style.display = "block";
    return;
  }

  // CAPITAL LETTER
  if (!/[A-Z]/.test(pass)) {
    error.innerText = "Must include a capital letter";
    error.style.display = "block";
    return;
  }

  // ✅ SUCCESS
  error.style.color = "#4CAF50";
  error.innerText = "Account created!";
  error.style.display = "block";

  localStorage.setItem("username", user);
  localStorage.setItem("currentUser", user);
  console.log("Saved currentUser:", user);
  localStorage.setItem("password", pass);
  localStorage.setItem("email", email);



  
try {
await setDoc(
  doc(db, "users", user),
  {
    username: user,
    email: email,
    userId: "AUR-" + Math.random().toString(36).substring(2, 10).toUpperCase(),
    createdAt: new Date().toISOString()
  }
);

   console.log("User saved to Firestore");
} catch (err) {
  console.error(err);
}

 setTimeout(() => {
  window.location = "chat_v2.html";
}, 1000);
}


  function goBack() {
  window.location = "index.html"; // or login.html
}


</script>

</body>
</html>
