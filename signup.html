<!DOCTYPE html>
<html>
<head>
<title>Sign Up - Auralis</title>

<style>

body {
  margin: 0;
  height: 100vh;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;

  background-image: url("MainBG.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
/* 🎬 ORBS */
.orb {
  filter: blur(140px);
  opacity: 0.25;
  pointer-events: none;
}

.orb1 {
  background: #8B5CF6;
}

.orb2 {
  background: #FF7EDB;
}



@keyframes zoom {
  from { background-size: 100%; }
  to { background-size: 110%; }
}

/* 💎 BOX */
#box {
  width: 280px;
  padding: 30px;
  border-radius: 20px;

  display: flex;
  flex-direction: column;
  align-items: center;

  text-align: center;

  background: rgba(22, 16, 51, 0.88);

  backdrop-filter: blur(20px);

  border: 1px solid rgba(215, 184, 255, 0.15);

  box-shadow:
    0 0 25px rgba(139, 92, 246, 0.25),
    0 0 50px rgba(255, 126, 219, 0.12);
}

#box:hover {
  box-shadow:
    0 0 35px rgba(139, 92, 246, 0.4),
    0 0 70px rgba(255, 126, 219, 0.2);

  border-color: rgba(215, 184, 255, 0.25);

  transition: all 0.3s ease;
}

/* INPUT */

/* ALL INPUTS SAME WIDTH */
#box input {
  width: 100%;
  max-width: 240px;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
 background: #24184A;
border: 1px solid rgba(215, 184, 255, 0.1);
color: white;
}

h2 {
  color: #D7B8FF;

  text-shadow:
    0 0 10px rgba(161, 92, 255, 0.4);
}

.brand-glow {
  position: absolute;
  font-size: 120px;
  font-weight: bold;
  letter-spacing: 10px;
  color: rgba(255,255,255,0.03);
  pointer-events: none;
}

/* PASSWORD WRAPPER */
.password-box {
padding-right: 20px;
  width: 100%;
  max-width: 240px;
  position: relative;
}

/* SPACE FOR ICON */
.password-box input {
  width: 100%;
  padding: 10px;
  padding-right: 35px;

  border: 1px solid rgba(215, 184, 255, 0.1);
  border-radius: 8px;

  background: #24184A;
  color: white;

  outline: none;
}

/* BUTTON */

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;

  border: none;
  border-radius: 10px;

  background: linear-gradient(
    135deg,
    #8B5CF6,
    #FF7EDB
  );

  color: white;
  cursor: pointer;

  transition: all 0.25s ease;

  box-shadow:
    0 0 15px rgba(139, 92, 246, 0.35),
    0 0 30px rgba(255, 126, 219, 0.15);
}

button:hover {
  transform: translateY(-2px);

  box-shadow:
    0 0 25px rgba(139, 92, 246, 0.5),
    0 0 50px rgba(255, 126, 219, 0.3);
}

.toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%); /* 🔥 perfect vertical center */
  cursor: pointer;
}

.eye {
  width: 20px;
  height: 20px;
  stroke: #aaa;
  transition: 0.2s;
}

/* go back button CSS */

.backBtn {
  width: 100%;
  padding: 10px;
  margin-top: 8px;

  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);

  background: rgba(255,255,255,0.05);
  color: #cbd5f5;

  cursor: pointer;
  transition: all 0.25s ease;

  box-shadow: 0 0 0 rgba(88, 101, 242, 0); /* base */
}

.backBtn:hover {
  border-color: rgba(88, 101, 242, 0.6);

  box-shadow:
    0 0 10px rgba(88, 101, 242, 0.3),
    0 0 20px rgba(88, 101, 242, 0.15);

  background: rgba(255,255,255,0.08);
}

</style>
</head>

<body>

<!-- 🎬 BACKGROUND -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div id="box">
  <h2>Create Account</h2>

  <input id="username" placeholder="Username">

  <!-- email input-->

  <input
  id="email"
  type="email"
  placeholder="Email Address">

  <!-- 👁️ PASSWORD -->
  <div class="password-box">
  <input id="password" type="password" placeholder="Password">
  <span class="toggle" onclick="togglePassword('password', this)">
    <!-- OPEN EYE -->
    <svg class="eye" viewBox="0 0 24 24">
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </span>
</div>

<div class="password-box">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">
  <span class="toggle" onclick="togglePassword('confirmPassword', this)">
    <svg class="eye" viewBox="0 0 24 24">
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </span>
</div>


<!-- for the sign up / go back btns-->

<p id="error"
   style="color:#ff6b6b; font-size:13px; display:none;">
</p>

<button onclick="signup()">Sign Up</button>

<button class="backBtn" onclick="goBack()">
  Go Back
</button>


<!-- firebase script-->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
  getAuth,
  createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFZ0kdYk-HupIbGxTuY5EqE24xnwApEyc",
  authDomain: "auralis-web-app.firebaseapp.com",
  projectId: "auralis-web-app",
  storageBucket: "auralis-web-app.firebasestorage.app",
  messagingSenderId: "817840303664",
  appId: "1:817840303664:web:cc89d235f2ce1adcb307f5",
  measurementId: "G-N117VGDYMG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


window.db = db;
window.doc = doc;
window.setDoc = setDoc;
window.auth = auth;
window.createUserWithEmailAndPassword =

createUserWithEmailAndPassword;

</script>

<!-- personal script-->
<script>
/* 👁️ PASSWORD TOGGLE */
function togglePassword(id, el) {
  const input = document.getElementById(id);
  const svg = el.querySelector("svg");

  if (input.type === "password") {
    input.type = "text";

    // 👁️ OPEN EYE
    svg.innerHTML = `
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7-3-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    `;
  } else {
    input.type = "password";

    // 🙈 CLOSED EYE (like your image)
    svg.innerHTML = `
      <path d="M2 2l20 20"/>
      <path d="M12 5C5 5 2 12 2 12s3 7 10 7 10-7 10-7"/>
    `;
  }
}

/* SIGNUP */


async function signup() {
  const user = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();  const confirm = document.getElementById("confirmPassword").value.trim();
  const email = document.getElementById("email").value.trim();
  const error = document.getElementById("error");


 let cred;

try {

  cred = await createUserWithEmailAndPassword(
    auth,
    email,
    password
  );

} catch (err) {

  console.log("CODE:", err.code);
  console.log("MESSAGE:", err.message);

  console.error(err);

  if (err.code === "auth/email-already-in-use") {

    error.innerText =
      "This email already has an account.";

  } else {

    error.innerText = err.message;

  }

  error.style.display = "block";
  return;
}




  // ✅ make sure error exists
  if (!error) {
    alert("Error element missing!");
    return;
  }

  // reset message
  error.style.display = "none";
  error.innerText = "";

  // 🏠 CREATE DEFAULT SERVER

  const server = {
  name: user + "'s Server",
  icon: user.charAt(0).toUpperCase()
};

localStorage.setItem("server", JSON.stringify(server));

  // REQUIRED
  if (user === "" || password === "" || confirm === "") {
    error.innerText = "Username and password are required!";
    error.style.display = "block";
    return;
  }

  // MATCH
  if (password !== confirm) {
    error.innerText = "Passwords do not match!";
    error.style.display = "block";
    return;
  }

  // LENGTH
  if (password.length < 8) {
    error.innerText = "Password must be at least 8 characters";
    error.style.display = "block";
    return;
  }

  // CAPITAL LETTER
  if (!/[A-Z]/.test(password)) {
    error.innerText = "Must include a capital letter";
    error.style.display = "block";
    return;
  }

  // ✅ SUCCESS
  error.style.color = "#4CAF50";
  error.innerText = "Account created!";
  error.style.display = "block";

  localStorage.setItem("username", user);
  localStorage.setItem("currentUser", user);
  console.log("Saved currentUser:", user);
  localStorage.setItem("password", password);
  localStorage.setItem("email", email);



  
try {




await setDoc(
  doc(db, "users", cred.user.uid),
  {
    username: user,
    email: email,
    authUid: cred.user.uid,
    createdAt: new Date().toISOString(),
    status: "online"
  }
);

   console.log("User saved to Firestore");
} catch (err) {
  console.error("SIGNUP ERROR FULL:", err);
  console.error("CODE:", err.code);
  console.error("MESSAGE:", err.message);
  alert(err.message);
}

 setTimeout(() => {
  window.location = "chat_v2.html";
}, 1000);
}


  function goBack() {
  window.location = "index.html"; // or login.html
}


</script>

</body>
</html>
