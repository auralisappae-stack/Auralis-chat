<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - Auralis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(-45deg, #1e1f22, #2b2d31, #313338, #5865f2);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #container {
      width: 300px;
      text-align: center;
      padding: 40px;
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(88,101,242,0.8);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: #1e1f22;
      color: white;
      outline: none;
    }

    .password-box {
      position: relative;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 12px;
      cursor: pointer;
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #5865f2, #4752c4);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .link {
      margin-top: 15px;
      color: #aaa;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="container">

  <img src="logo.png">

  <h2>Create Account</h2>
  <p style="color:#aaa;">Join Auralis</p>

  <input id="username" placeholder="Username">

  <div class="password-box">
    <input id="password" type="password" placeholder="Password">
    <span class="toggle" onclick="togglePassword()">👁️</span>
  </div>

  <button onclick="signup()">Sign Up</button>

  <div class="link" onclick="goLogin()">
    Already have an account? Login
  </div>

</div>

<script>
function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

function signup() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  const ws = new WebSocket("wss://auralis-chat.onrender.com");

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: "signup",
      username: user,
      password: pass
    }));
  };

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.success) {
      alert("Account created!");
      window.location.href = "login.html";
    } else {
      alert("Signup failed");
    }
  };
}

function goLogin() {
  window.location.href = "login.html";
}
</script>

</body>
</html>
